async function cargarPedido(id) {
  const key = 'fj_pedido_' + id;
  if (navigator.onLine) {
    const [p, l, a, en] = await Promise.all([
      sb.from('pedidos').select('id,cliente_id,estado,fecha_entrega,notas,preparador_id,clientes(codigo,nombre,nombre_comercial,forma_pago,direccion,localidad,recargo_equivalencia)').eq('id', id).single(),
      sb.from('lineas_pedido').select('id,producto_id,estado,cantidad_pedida,unidad_pedida,peso_real,unidad_precio,precio,iva,version,notas,productos(codigo,nombre,iva)').eq('pedido_id', id),
      sb.from('albaranes').select('serie,numero,fecha,estado').eq('pedido_id', id).maybeSingle(),
      sb.from('entregas').select('entregado_at,entregado_por').eq('pedido_id', id).maybeSingle()]);
    const err = p.error || l.error || a.error;
    if (!err) { const d = { pedido: p.data, lineas: l.data, albaran: a.data, entrega: en.error ? null : en.data }; LS.set(key, d); return d; }
    if (!isNetErr(err)) throw err;
  }
  const d = LS.get(key, null);
  if (!d) throw new Error('Sin conexión y sin datos guardados de este pedido.');
  d.cache = true; return d;
}
function vistaPedido() {

function abrirLinea(l) {
  state.sheetAbierta = true;
  const unidad = l.unidad_precio === 'kg' ? 'kg' : 'unidades';
  const input = h('input', {
    class: 'big', type: 'text', inputmode: 'decimal', autocomplete: 'off',
    placeholder: num(l.cantidad_pedida), value: l._peso != null ? String(l._peso).replace('.', ',') : ''
  });
  const cerrar = () => { ov.remove(); state.sheetAbierta = false; };
  const guardar = () => {
    const v = parseNum(input.value);
    if (v === null || v < 0) { toast('Escribe un número válido', 'err'); input.focus(); return; }
    const id = state.params.id; const idx = state.lv.findIndex(x => x.id === l.id);
    cerrar();
    encolar(l, v, id, l.productos ? l.productos.nombre : '');
    pintarPedido();
    sincronizar().then(() => actualizarPedido());
    const sig = state.lv.slice(idx + 1).concat(state.lv.slice(0, idx)).find(x => !x._hecha);
    if (sig) setTimeout(() => abrirLinea(sig), 120);
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') guardar(); });
  const ov = h('div', { class: 'overlay', onclick: e => { if (e.target === ov) cerrar(); } },
    h('div', { class: 'sheet' },
      h('h2', {}, l.productos ? l.productos.nombre : ''),
      h('div', { class: 'sub' }, 'Pedido: ' + num(l.cantidad_pedida) + ' ' + l.unidad_pedida),
      input, h('div', { class: 'unidad' }, 'Cantidad real en ' + unidad),
      h('button', { class: 'guardar', onclick: guardar }, 'Guardar'),
      h('div', { class: 'acciones' },
        h('button', { class: 'ghost', onclick: () => { input.value = '0'; guardar(); } }, 'No hay (0)'),
        h('button', { class: 'ghost', onclick: () => { cerrar(); const d = state.ped; abrirIncidencia({ cliente: d.pedido.cliente_id ? Object.assign({ id: d.pedido.cliente_id }, d.pedido.clientes) : null, producto: l.producto_id ? { id: l.producto_id, nombre: l.productos ? l.productos.nombre : '' } : null, pedido_id: d.pedido.id, linea_id: l.id }); } }, '⚠ Problema'),
        h('button', { class: 'ghost', onclick: cerrar }, 'Cancelar'))));
  document.body.append(ov);
  setTimeout(() => { input.focus(); input.select(); }, 50);
}
async function terminarPedido(id) {

  if (getCola().some(x => x.pedido_id === id)) { toast('Quedan cambios sin enviar. Inténtalo de nuevo en unos segundos.', 'err'); return; }
  const { data, error } = await sb.rpc('terminar_pedido', { p_pedido: id });
  if (error) { toast(msgErr(error), 'err'); actualizarPedido(); return; }
  toast('Pedido terminado. Albarán nº ' + data, 'ok');
  go('albaran', { id: id });
}
async function anularPedido(id) {
  if (!confirm('¿Anular este pedido?')) return;
  const { error } = await sb.from('pedidos').update({ estado: 'anulado' }).eq('id', id);

      h('div', { style: 'text-align:right' }, h('b', { style: 'font-size:18px' }, eur(f.pend) + ' €'), h('div', {}, h('button', { class: 'small', onclick: () => abrirCobro('Cobrar albarán ' + (f.numero_albaran || ''), [{ pedido_id: f.pedido_id, pendiente: f.pend }], cargar) }, 'Cobrar'))))), ...(ps.length ? [] : [h('p', { class: 'vacio' }, 'No hay albaranes pendientes de cobro. 👍')]));
    const por = {}; ps.forEach(f => { const c = por[f.cliente_id] || (por[f.cliente_id] = { nombre: f.cliente_nombre, cod: f.cliente_codigo, items: [], tot: 0, venc: 0, ant: f.fecha_entrega }); c.items.push(f); c.tot += f.pend; if (f.vencido) c.venc += f.pend; if (f.fecha_entrega < c.ant) c.ant = f.fecha_entrega; });
    const cl = Object.values(por).sort((a, b) => b.tot - a.tot);
    pb.replaceChildren(buscar2, h('div', { class: 'letra' }, 'Clientes con deuda (' + cl.length + ')'), ...cl.map(c => h('div', { class: 'card' }, h('div', { class: 'fila' }, h('div', {}, h('div', { class: 'nombre', style: 'font-size:16px' }, c.nombre), h('div', { class: 'sub' }, c.items.length + (c.items.length === 1 ? ' albarán' : ' albaranes') + ' · el más antiguo del ' + fechaES(c.ant))),
      h('div', { style: 'text-align:right' }, h('b', { style: 'font-size:18px' }, eur(r2(c.tot)) + ' €'), c.venc ? h('div', { style: 'color:var(--rojo);font-size:13px;font-weight:700' }, 'vencido ' + eur(r2(c.venc)) + ' €') : null)),
      h('button', { class: 'ghost small', style: 'width:100%;margin-top:8px', onclick: () => abrirCobro('Cobrar a ' + c.nombre, c.items.map(f => ({ pedido_id: f.pedido_id, pendiente: f.pend })), cargar) }, 'Cobrar')), ), ...(cl.length ? [] : [h('p', { class: 'vacio' }, 'Ningún cliente con deuda.')]));
    const tf = r2(facturas.reduce((a, f) => a + Number(f.importe || 0), 0));
    pc.replaceChildren(h('div', { class: 'card' }, h('div', { class: 'fila' }, h('div', { class: 'nombre' }, 'Facturas de proveedores por pagar'), h('div', { class: 'tot-num' }, eur(tf) + ' €')), h('div', { class: 'sub' }, facturas.length + ' documentos sin marcar como pagados' + (facturas.some(f => f.importe == null) ? ' (algunos sin importe)' : ''))),
      ...facturas.map(f => h('div', { class: 'card fila' }, h('div', {}, h('div', { class: 'nombre', style: 'font-size:16px' }, f.proveedores ? uno(f.proveedores).nombre : 'Sin proveedor'), h('div', { class: 'sub' }, [TIPOS_DOC[f.tipo], fechaES(f.fecha), f.nota].filter(Boolean).join(' · '))),
        h('div', { style: 'text-align:right' }, h('b', {}, f.importe != null ? eur(f.importe) + ' €' : 'sin importe'), h('div', {}, h('button', { class: 'small', onclick: async () => { if (!await confirmar('¿Marcar como pagada?')) return; const u = await sb.from('documentos_compra').update({ pagada: true, fecha_pago: hoy() }).eq('id', f.id); if (u.error) toast(msgErr(u.error), 'err'); else { toast('Marcada como pagada', 'ok'); cargar(); } } }, 'Pagada'))))),
      ...(facturas.length ? [] : [h('p', { class: 'vacio' }, 'No hay facturas de proveedores pendientes. Se añaden en Facturas de compra.')]));
  }
  cont.append(pa, pb, pc);
  $app.replaceChildren(shell('Deudas', h('div', {}, chips, cont))); renderBanner(); pintarChips(); mostrar(); cargar();
  state.refrescarCobros = cargar;
}

/* =====================  ARRANQUE  ===================== */
function render() {
  clearInterval(state.chatTimer); state.chatTimer = null;
  if (!state.user) return vistaLogin();
  if (!state.perfil) return vistaSinPerfil();
  const v = { lista: vistaLista, pedido: vistaPedido, nuevo: vistaNuevo, catalogo: vistaCatalogo, albaran: vistaAlbaran, carga: vistaCarga, clientes: vistaClientes, cliente: vistaCliente, chat: vistaChat, perfil: vistaPerfil, fichajes: vistaFichajes, mas: vistaMas, inicio: vistaMas, cobros: vistaCobros, compras: vistaCompras, traza: vistaTraza, entregas: vistaEntregas, calendario: vistaCalendario, incidencias: vistaIncidencias, precios: vistaPrecios, facturas: vistaFacturas, resumen: vistaResumen, archivo: vistaArchivo, avisos: vistaAvisos, ruta: vistaRuta, rentabilidad: vistaRentabilidad, deudas: vistaDeudas }[state.view] || vistaLista;
  if ((state.view === 'nuevo' || state.view === 'catalogo') && !esOficina()) return vistaLista();
  v();
}
function tick() {
  if (!state.user || !state.perfil) return;
  renderBanner();
  if (!navigator.onLine) return;
  sincronizar(); sincronizarCarga(); sincronizarFichaje(); sincronizarCobros(); sincronizarEntregas(); sincronizarInc(); comprobarEntregas(); if (state.view !== 'chat') contarChat();
  if (!document.hidden && !state.sheetAbierta) refrescarVista();
}
async function init() {
  if (!sb) {
    $app.replaceChildren(h('div', { class: 'login' }, h('h1', {}, 'Ferjusanz'),
      h('p', {}, 'No se ha podido cargar la aplicación. Conéctate a internet y vuelve a intentarlo.'),
      h('button', { onclick: () => location.reload() }, 'Reintentar')));
    return;
  }
  try { const { data } = await sb.auth.getSession(); if (data && data.session) await cargarPerfil(data.session.user); } catch (e) { }
  render(); cargarGente();
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { state.user = null; state.perfil = null; render(); } });
  window.addEventListener('online', () => { renderBanner(); sincronizar(); sincronizarCarga(); sincronizarFichaje(); sincronizarCobros(); sincronizarEntregas(); sincronizarInc(); refrescarVista(); });
  window.addEventListener('offline', renderBanner);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  setInterval(tick, 8000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
}
init();
