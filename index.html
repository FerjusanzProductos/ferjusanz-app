async function buscar(tabla, texto, soloActivos, limite) {

  const t = limpiaBusqueda(texto);
  if (t) q = q.or(tabla === 'clientes'

      const kids = [];
      kids.push(grupo('Clientes', cl.slice(0, 8).map(c => fila(nc(c), c.codigo + (c.activo ? '' : ' · inactivo'), () => go('cliente', { id: c.id })))));

async function init() {

  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { state.user = null; state.perfil = null; render(); } });
