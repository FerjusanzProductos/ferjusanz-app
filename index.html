<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b7f3b">
<title>Ferjusanz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--verde:#1b7f3b;--verde-osc:#14602c;--verde-cl:#e6f4ea;--gris:#f3f4f2;--borde:#d9ddd6;--txt:#1d2520;--txt2:#5d6a60;--rojo:#b3261e;--ambar:#b36b00;--ambar-cl:#fff3d6}
*{box-sizing:border-box}
html,body{overflow-x:clip;margin:0;padding:0;background:var(--gris);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;min-height:52px;padding:0 18px;background:var(--verde);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:#fff;color:var(--txt);border:1px solid var(--borde)}
button.peligro{background:#fff;color:var(--rojo);border:1px solid var(--rojo)}
button.small{min-height:40px;padding:0 12px;font-size:15px}
input,select,textarea{width:100%;min-height:52px;border:1px solid var(--borde);border-radius:12px;padding:8px 14px;background:#fff}
input.big{font-size:36px;text-align:center;min-height:76px;font-weight:700}
.shell{min-height:100vh;display:flex;flex-direction:column;padding-bottom:78px}
header{position:sticky;top:0;z-index:5;background:var(--verde);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
header .logo{font-weight:800;letter-spacing:.3px}
header .tit{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;opacity:.95;text-align:center}
header>*{flex-shrink:0}
header>.tit,header>.who,header>.quien{flex-shrink:1;min-width:0}
header .who{font-size:13px;opacity:.85;max-width:35%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .back{background:rgba(255,255,255,.18);min-height:40px;padding:0 12px}
main{padding:12px 12px 24px;max-width:760px;width:100%;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--borde);display:flex;gap:3px;padding:8px 4px;padding-bottom:calc(8px + env(safe-area-inset-bottom));z-index:6}
nav.tabs button{flex:1;min-width:0;padding:6px 2px;background:#fff;color:var(--txt2);border:1px solid transparent;min-height:56px;font-size:14px}
nav.tabs button.on{background:var(--verde-cl);color:var(--verde-osc);border-color:var(--verde)}
.banner{display:none;padding:8px 14px;font-weight:600;font-size:15px;text-align:center}
.banner.aviso{display:block;background:var(--ambar-cl);color:var(--ambar)}
.banner.off{display:block;background:#fde7e5;color:var(--rojo)}
.barra{display:flex;gap:8px;margin-bottom:10px}
.barra button{min-width:52px}
.bandeja-fac{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(135deg,#1b7f3b,#14602c);color:#fff;border:0;border-radius:16px;padding:14px 16px;margin-bottom:10px;min-height:64px;box-shadow:0 2px 6px rgba(0,0,0,.18)}.bandeja-fac.on{outline:3px solid #f2b400}.bandeja-fac .ic{font-size:30px}.bandeja-fac .tt{flex:1;font-size:17px;font-weight:700;line-height:1.2}.bandeja-fac .tt small{display:block;font-weight:400;font-size:14px;opacity:.9;margin-top:2px}.bandeja-fac .num{background:#f2b400;color:#1d2520;border-radius:999px;min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;padding:0 8px}.bandeja-fac .num.cero{background:rgba(255,255,255,.25);color:#fff}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:8px;margin-bottom:6px}
.chips:has(>.chip:nth-child(9)){display:flex;overflow-x:auto}
.chips .chip{white-space:normal;line-height:1.15;padding:6px 8px}
.chip{background:#fff;color:var(--txt);border:1px solid var(--borde);min-height:46px;white-space:nowrap;font-weight:500}
.chip.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.resalta{outline:3px solid #ef4444;outline-offset:2px;border-radius:12px;animation:parp .5s 3}
@keyframes parp{50%{outline-color:#fecaca}}
.irfalta{cursor:pointer;text-decoration:underline;padding:6px 0;font-weight:600}
.card{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:14px;margin-bottom:10px}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--verde-cl)}
.fila{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nombre{font-weight:700;font-size:18px}
.sub{color:var(--txt2);font-size:14px}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:#eef0ec;color:var(--txt2)}
.badge.pend{background:#eef0ec}
.badge.prep{background:var(--ambar-cl);color:var(--ambar)}
.badge.fin{background:var(--verde-cl);color:var(--verde-osc)}
.badge.cont{background:#e3eefc;color:#1e4f8f}
.progreso{height:8px;background:#e6e9e3;border-radius:6px;overflow:hidden;margin-top:10px}
.progreso>i{display:block;height:100%;background:var(--verde)}
.linea{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:2px solid var(--borde);border-radius:14px;padding:14px;margin-bottom:8px;min-height:68px}
.linea.hecha{border-color:var(--verde);background:var(--verde-cl)}
.linea.pendiente-envio{border-style:dashed}
.linea .peso{font-size:22px;font-weight:800;white-space:nowrap}
.linea .peso.vacio{color:var(--txt2);font-weight:500;font-size:18px}
.vacio{color:var(--txt2);text-align:center;padding:24px 8px}
.err{color:var(--rojo)}
.aviso-card{background:var(--ambar-cl);border:1px solid #f0d28a;color:#6a4200;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:15px}
.login{max-width:380px;margin:12vh auto 0;padding:0 18px;display:flex;flex-direction:column;gap:12px}
.login h1{margin:0;color:var(--verde);font-size:34px}
.login .sub{margin:0 0 6px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:22px}
.sheet .unidad{text-align:center;color:var(--txt2);margin-top:-6px}
.sheet .acciones{display:flex;flex-wrap:wrap;gap:10px}
/* Máximo dos columnas: cualquier fila con 3 o más botones se parte en dos columnas */
div[style*="display:flex"]:has(>button:nth-child(3)){flex-wrap:wrap}
div[style*="display:flex"]:has(>button:nth-child(3))>button{flex:1 1 calc(50% - 8px)}
div[style*="display:grid"]:has(>button:nth-child(3)){grid-template-columns:1fr 1fr!important}
.sheet .acciones button{flex:1 1 calc(50% - 10px);min-height:48px}
.sheet .guardar{min-height:68px;font-size:20px}
label.campo{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--txt2);margin-bottom:10px}
.res{background:#fff;border:1px solid var(--borde);border-radius:12px;margin-top:6px;overflow:hidden}
.res button{display:block;width:100%;text-align:left;background:#fff;color:var(--txt);border-radius:0;border-bottom:1px solid var(--borde);min-height:48px;font-weight:500}
.res button:last-child{border-bottom:0}
.rowcat{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.rowcat .controles{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rowcat select{min-height:42px;width:auto}
.interruptor{display:flex;align-items:center;gap:6px;font-size:15px}
.interruptor input{width:22px;min-height:22px;height:22px}
#toast{position:fixed;left:12px;right:12px;bottom:92px;z-index:40;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#toast div{background:#222;color:#fff;border-radius:12px;padding:12px 14px;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#toast div.err{background:var(--rojo)}
#toast div.ok{background:var(--verde-osc)}
/* ---- Albarán ---- */
.alb-wrap{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:10px;overflow-x:auto}
.copia{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:13px;padding:4px 2px;margin-bottom:14px}
.copia .cab{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:6px}
.copia .emp b{font-size:17px}
.copia .emp div{font-size:11px;line-height:1.35}
.copia .num{text-align:right;font-size:12px}
.copia .num b{font-size:18px;display:block}
.copia .tz{font-size:10px;color:#333;margin-top:1px}
.rep-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rep-btn{min-height:52px;display:flex;align-items:center;gap:8px;justify-content:center;font-weight:800;border:3px solid var(--c);background:#fff;color:#111;border-radius:14px}
.pto{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.leyenda{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.ley{display:flex;align-items:center;gap:8px;border:2px solid var(--c);border-radius:12px;padding:8px 10px;font-weight:700;background:#fff}
.cab-rep{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;border-radius:12px;padding:10px 12px;margin:12px 0 6px}
.cab-rep span{font-size:13px;opacity:.95}
.nparada{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.parada.hecha{opacity:.55}
.parada .mov{display:flex;gap:4px}.parada .mov .small{min-width:40px;min-height:40px;padding:0}
.chk-g{width:26px;height:26px;min-height:26px;flex:none}
.barra-sel{position:sticky;bottom:70px;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:2px solid var(--verde);border-radius:14px;padding:8px 10px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.maps-btn{display:block;text-align:center;padding:14px;margin-bottom:8px;border-radius:14px;color:#fff;font-weight:800;text-decoration:none}
.paleta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.paleta .col{width:34px;height:34px;min-height:34px;padding:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #9ca3af}.paleta .col.on{box-shadow:0 0 0 3px #111}
.firma-img{height:56px;max-width:60%;display:block;margin:2px 0}
.firma-ov{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:10px}
.firma-card{background:#fff;border-radius:16px;padding:14px;width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px}
.firma-card canvas{width:100%;height:230px;border:2px dashed #6b7280;border-radius:12px;touch-action:none;background:#fff}
.copias-imp{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.copia-btn{width:100%;min-height:58px;text-align:left;display:flex;flex-direction:column;gap:2px;border-radius:14px;color:#111;border:2px solid #d1d5db;background:#fff;padding:10px 14px}
.copia-btn .ct{font-weight:800;font-size:16px}.copia-btn .ce{font-size:13px;font-weight:400;color:#374151}
.copia-btn.blanca{background:#fff}.copia-btn.amarilla{background:#fff6b8;border-color:#e5c800}.copia-btn.rosa{background:#fde2ea;border-color:#e58aa6}
.copia-btn.rec{border-width:3px;border-color:var(--verde)}
.copia.rosa{background:#fde2ea}.copia.amarilla{background:#fff6b8}
.copia.rosa,.copia.amarilla{padding:8px 6px;border-radius:6px}
.copia .tipo{font-weight:700;font-size:11px;letter-spacing:1px;border:1px solid #000;display:inline-block;padding:1px 6px;margin-top:4px}
.copia .cli{border:1px solid #000;padding:6px 8px;margin-bottom:6px;line-height:1.4}
.copia table{width:100%;border-collapse:collapse}
.copia th,.copia td{border-bottom:1px solid #999;padding:4px 3px;text-align:left;vertical-align:top}
.copia th{border-bottom:2px solid #000;font-size:12px}
.copia td.d,.copia th.d{text-align:right;white-space:nowrap}
.copia .tot{margin-top:8px;text-align:right;font-size:15px}
.copia .pie{margin-top:12px;border:1px solid #000;padding:8px;min-height:60px}
.copia .cond{margin-top:6px;font-weight:700}
.copia.ticket{max-width:72mm;font-size:11px}
.copia.ticket .cab{flex-direction:column}
.copia.ticket .num{text-align:left}
.copia.ticket .oc-ticket{display:none}
.copia table.iva{width:100%;margin:6px 0 0;font-size:13px}.copia table.iva td{border:0;padding:2px 4px}.copia .totiva{text-align:right;font-size:16px;margin:4px 0 8px}
.av{border-radius:50%;object-fit:cover;background:#cfe3d4;color:#14532d;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
header .quien{background:transparent;color:#fff;min-height:40px;padding:0 2px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;max-width:38%}
header .quien span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:480px){header .quien span{display:none}header .tit{font-size:14px}}
.insig{background:#c0392b;color:#fff;border-radius:999px;font-size:11px;padding:1px 6px;margin-left:3px}
.insig:empty{display:none}
.chatlista{display:flex;flex-direction:column;gap:6px;padding-bottom:84px}
.msg{display:flex;gap:6px;align-items:flex-end;max-width:88%}
.msg.mio{align-self:flex-end;flex-direction:row-reverse}
.burbuja{background:#fff;border:1px solid var(--borde);border-radius:14px 14px 14px 4px;padding:7px 11px;white-space:pre-wrap;word-break:break-word}
.msg.mio .burbuja{background:var(--verde-cl);border-color:#bfe0c8;border-radius:14px 14px 4px 14px}
.burbuja .quien2{font-size:12px;font-weight:700;color:var(--verde-osc);display:block}
.burbuja .hora{font-size:11px;color:var(--txt2);float:right;margin:4px 0 0 10px}
.diachat{align-self:center;font-size:12px;color:var(--txt2);background:#e7e9e4;border-radius:999px;padding:2px 10px;margin:6px 0}
.compositor{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));background:#f2f3ef;border-top:1px solid var(--borde);padding:8px 10px;display:flex;gap:8px;z-index:5}
.compositor textarea{min-height:48px;max-height:120px;resize:none;flex:1}
.compositor button{min-width:76px}
.fichar-btn{width:100%;min-height:84px;font-size:24px;font-weight:800;border-radius:18px}
.fichar-btn.sal{background:#b45309}
.perfil-cab{display:flex;flex-direction:column;align-items:center;gap:6px;margin:8px 0 14px}
.letra{font-weight:800;color:var(--verde-osc);margin:12px 4px 6px}
.hoja{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:12px}
.hoja h1{font-size:18px;margin:0 0 8px}
.hoja h2{font-size:14px;margin:12px 0 4px}
.hoja .blq{border:1px solid #000;margin-bottom:8px;break-inside:avoid;page-break-inside:avoid}
.hoja .cb{display:flex;justify-content:space-between;gap:8px;padding:4px 6px;background:#eee;font-weight:700;border-bottom:1px solid #000}
.hoja table{width:100%;border-collapse:collapse}
.hoja td,.hoja th{padding:3px 6px;border-bottom:1px solid #bbb;text-align:left;vertical-align:top}
.hoja td.d,.hoja th.d{text-align:right;white-space:nowrap}
.hoja .caja{display:inline-block;width:12px;height:12px;border:1.5px solid #000;vertical-align:middle;margin-right:6px}
.hoja .caja.on{background:#000}
.tot-num{font-size:20px;font-weight:800;white-space:nowrap;text-align:right}
.nota-c{font-size:13px;color:#92400e;background:#fef3c7;border-radius:8px;padding:2px 8px;margin-top:4px;display:inline-block}
.tot-num.cambiado{color:#b45309}
.ed{min-width:44px;min-height:44px;padding:0;font-size:18px}
.cgrid .pTabla{display:none}.cgrid.vt .pLista{display:none}.cgrid.vt .pTabla{display:block}
@media(min-width:900px){.cvista{display:none}.cgrid{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:14px;align-items:start}.cgrid .pLista,.cgrid .pTabla,.cgrid.vt .pLista,.cgrid.vt .pTabla{display:block}.cgrid .pTabla{position:sticky;top:8px}}
.tabla-wrap{overflow:auto;max-height:68vh;border:1px solid #d1d5db;border-radius:10px;background:#fff;-webkit-overflow-scrolling:touch}
table.mx{border-collapse:separate;border-spacing:0;font-size:var(--mxfs,13px);min-width:100%}
table.mx th,table.mx td{border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;padding:0 4px;height:var(--mxh,30px);text-align:center;white-space:nowrap}
table.mx td{min-width:62px}
table.mx td.v{background:#ecfdf3;font-weight:700}
table.mx thead th{position:sticky;top:0;z-index:3;background:#f3f4f6;height:auto;padding:4px;white-space:normal;min-width:70px;max-width:90px;vertical-align:bottom}
table.mx .np{font-size:.85em;line-height:1.15;font-weight:700;word-break:break-word}
table.mx .up{font-size:.77em;font-weight:400;color:#6b7280}
table.mx .c0{position:sticky;left:0;z-index:2;background:#f9fafb;text-align:left;min-width:110px;max-width:150px;white-space:normal;font-size:.92em;line-height:1.1}
table.mx thead th.c0{z-index:4}
table.mx .c0 small{color:#6b7280;font-weight:400}
table.mx tfoot td,table.mx tfoot th{position:sticky;z-index:3;font-weight:800;background:#e5e7eb}
table.mx tfoot th.c0{z-index:5}
table.mx tfoot tr.ta td,table.mx tfoot tr.ta th{background:#d1fae5}
table.mx tfoot tr.ta td.dif{color:#b45309}
table.mx tfoot tr.ts td,table.mx tfoot tr.ts th{background:#f3f4f6;font-weight:600}
table.mx tr.hl-f td,table.mx tr.hl-f th.c0{background:#fef08a!important}
table.mx td.hl-c{background:#fef9c3!important}
table.mx tr.hl-f td.hl-c{background:#facc15!important}
.tabla-wrap{max-height:72vh}
.zoom-fila{display:flex;gap:8px;align-items:center;margin-bottom:6px}.zoom-b{display:flex;gap:6px}.zoom-b .small,.zoom-fila .small{min-height:38px}
.mxfull{position:fixed;inset:0;z-index:80;background:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.mxfull-b{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px}
.tabla-wrap.fs{flex:1;max-height:none;border-radius:0;border-left:0;border-right:0}
@page tabla{size:A4 landscape;margin:7mm}
.hoja.apaisada{page:tabla}
.hoja.apaisada .bloque{page-break-after:always;break-after:page}
.hoja.apaisada .bloque:last-child{page-break-after:auto;break-after:auto}
.hoja table.mximp{font-size:10px;table-layout:auto}
.hoja table.mximp th,.hoja table.mximp td{padding:2px 3px;border:1px solid #999;text-align:center;line-height:1.15}
.hoja table.mximp th:first-child,.hoja table.mximp td:first-child{text-align:left;width:42mm}
.hoja table.mximp thead th{background:#e5e7eb;font-size:9px;vertical-align:bottom}
.hoja table.mximp tr.tt td{font-weight:800;background:#e5e7eb}
.saludo{margin:4px 4px 0}
.rosco{position:relative;margin:4px auto 10px}
.rosco .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:112px;text-align:center;font-weight:800;color:var(--verde-osc);font-size:15px;line-height:1.15}
.rosco .ctr small{display:block;font-weight:600;color:var(--txt2);font-size:12px;margin-top:2px}
.rosco .circ{position:absolute;width:76px;transform:translate(-50%,-50%);gap:3px}
.rosco .circ .c{width:52px;height:52px;font-size:24px;border-width:3.5px}
.rosco .circ .l{font-size:11.5px;line-height:1.1;max-height:2.3em;overflow:hidden;font-weight:700}
.rosco .circ .insig{top:-6px;right:-6px}
.rosco.doble .circ .c{width:44px;height:44px;font-size:21px;border-width:3px}
.rosco.doble .circ .l{font-size:10.5px}
.rosco.doble .circ.dentro{width:64px}
.rosco.doble::after{content:'';position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:var(--verde-cl);border:2px solid var(--verde)}

nfirmar trazabilidad»."], "resumen": "Lo añades al pedido del cliente en el momento y el albarán se actualiza. No hace falta rehacer nada."}, {"id": "editar_pedido", "icono": "✏️", "grupo": "Día a día", "titulo": "Editar un pedido antes o durante la preparación", "roles": "t", "ir": "lista", "antes": "Si el cliente cambiaba algo o el pedido entraba con un fallo, había que anularlo y hacerlo de nuevo.", "ahora": "Cualquier persona del equipo puede corregir un pedido que aún no está terminado: cliente, fecha, productos, cantidades y precios. Queda anotado en el registro de cambios.", "pasos": ["Abre el pedido (en «Preparar» o «Lista de pedidos»).", "Pulsa «✏️ Editar pedido».", "Cambia el cliente, la fecha, las notas o las líneas (añadir, quitar, cantidad, unidad, precio).", "Pulsa «Guardar». Si el pedido ya está terminado, usa «Venta en ruta» para añadir algo."], "resumen": "Editar pedido: lo pueden hacer todos los roles mientras no esté terminado."}, {"id": "pegar_voz", "icono": "📋", "grupo": "Día a día", "titulo": "Pegar, dictar o capturar un pedido (más fácil que nunca)", "roles": "o", "ir": "importar", "antes": "Había que copiar a mano lo que llegaba por WhatsApp.", "ahora": "Pegas el mensaje tal cual, lo dictas o subes una captura. La app reconoce clientes y productos, recuerda los nombres que le corriges, y entiende precios sueltos como «patatas 0,62» sin confundirlos con un producto.", "pasos": ["Copia el mensaje en WhatsApp (mantén pulsado › Copiar).", "En la app entra en «Escribir pedido» y pulsa el botón grande «📋 Pegar lo copiado».", "Para dictar usa «🎤 Dictar pedido»; para una captura, «📷 Escanear pedido».", "Revisa lo rojo: toca el producto o cliente y elige el correcto. La próxima vez lo recordará.", "También puedes compartir un texto desde WhatsApp hacia la app instalada."], "resumen": "Pegar, dictar o capturar: la app reconoce y aprende. Precios sueltos tipo «patatas 0,62» se entienden."}, {"id": "docenas", "icono": "🥚", "grupo": "Día a día", "titulo": "Huevos y otros productos por docenas", "roles": "t", "ir": "catalogo", "antes": "Los huevos se apuntaban en kilos o en unidades aunque se venden por docenas.", "ahora": "Cada línea del pedido tiene su propia unidad, y «docena» es una de ellas. Puedes pedir, preparar y cobrar los huevos por docenas aunque el resto de productos vaya por kilo.", "pasos": ["Una sola vez (oficina): Productos › Huevos › «Se vende en docena» y «Precio por docena».", "Al hacer o editar un pedido, elige la unidad «docena» en la línea (o escribe «3 docenas de huevos» al pegar el pedido).", "Al preparar, anota las docenas reales. En el albarán sale «docenas» y el precio por docena.", "Si un cliente pide huevos «por unidades», cambia la unidad de esa línea a «pieza»."], "resumen": "Docenas: se elige «docena» como unidad de la línea; el precio es por docena."}, {"id": "ruta", "icono": "🗺️", "grupo": "Día a día", "titulo": "Ruta de reparto", "roles": "t", "ir": "ruta", "antes": "El orden de las paradas dependía de la memoria de cada repartidor.", "ahora": "La app propone el orden de las paradas según dónde está cada cliente y su horario.", "pasos": ["Entra en «Ruta», elige el día y la hora de salida (por defecto, Mercamadrid).", "Verás las paradas en orden, con la hora estimada de llegada.", "Para que funcione bien, cada cliente necesita su ubicación y su horario en la ficha (Clientes → Datos)."], "resumen": "La app propone el orden de las paradas según dónde está cada cliente y su horario."}, {"id": "albaranes", "icono": "🧾", "grupo": "Papeles e impresión", "titulo": "Albaranes y sus tres copias", "roles": "t", "ir": "albaranes", "antes": "Los albaranes se hacían a mano en papel, en tres copias de colores, y había que numerarlos y copiar los datos.", "ahora": "El albarán sale solo al terminar el pedido, con número, cliente, productos, pesos e importe. Se imprimen las tres copias de una vez.", "pasos": ["Entra en «Albaranes». Elige el periodo y busca por cliente o número. El botón de orden cambia entre más nuevos primero y más antiguos primero.", "Toca un albarán para abrirlo e imprimirlo.", "Salen tres copias: BLANCA (para el cliente si paga al momento), ROSA (oficina) y AMARILLA (oficina; si el cliente no paga al momento se le da esta en lugar de la blanca y la firma).", "Cada copia lleva escrito su nombre, así que se distinguen aunque la impresora no tenga color.", "Un albarán equivocado no se borra: la oficina lo anula con un motivo. Si solo falta algo, se usa «Venta en ruta».", "Elige el tamaño: papel A4 o ticket de 80 mm."], "resumen": "El albarán sale solo al terminar el pedido, con número, cliente, productos, pesos e importe. Se imprimen las tres copias de una vez."}, {"id": "bluetooth", "icono": "🖨️", "grupo": "Papeles e impresión", "titulo": "Imprimir con la impresora Bluetooth", "roles": "t", "ir": null, "antes": "Los albaranes se escribían a mano; las hojas de carga y compra, también.", "ahora": "Se imprimen desde el móvil, en la furgoneta o en el almacén, con una impresora Bluetooth pequeña. Albaranes, hoja de carga y hoja de compra salen con un botón.", "pasos": ["Una sola vez: empareja la impresora con el móvil en Ajustes → Bluetooth, y si la marca tiene aplicación o «servicio de impresión», instálalo (en Android suele ser lo que hace que aparezca en la lista de impresoras).", "En la app, abre el albarán (o la hoja de carga o de compra) y pulsa «Imprimir». Se abre la pantalla de impresión del móvil.", "Elige tu impresora Bluetooth en la lista y pulsa imprimir. Si no aparece, comprueba que está encendida y emparejada.", "Para impresoras de ticket (térmicas) elige «Ticket 80 mm» en el albarán. Para hojas grandes (hoja de carga y de compra) lo normal es A4 con una impresora de papel o guardar en PDF.", "Sin impresora a mano: en esa misma pantalla elige «Guardar como PDF» y envíalo por WhatsApp.", "Importante: esto depende de la impresora que compréis. Antes de comprar varias, probad una con un albarán real y decidid el tamaño que mejor se lee."], "resumen": "Se imprimen desde el móvil, en la furgoneta o en el almacén, con una impresora Bluetooth pequeña. Albaranes, hoja de carga y hoja de compra salen con un botón."}, {"id": "hojacarga_imp", "icono": "📄", "grupo": "Papeles e impresión", "titulo": "Hoja de carga y hoja de compra impresas", "roles": "t", "ir": "hojacompra", "antes": "Se hacía una hoja de compra para todos los pedidos del día, parecida a la de carga, y se apuntaba todo a mano.", "ahora": "Las dos hojas las genera la app. Se imprimen y, si hace falta, se anota a mano sobre el papel, como siempre.", "pasos": ["«Hoja de compra»: elige el día en el calendario (los pedidos suelen llegar días antes). Verás cada producto con lo pedido, el sobrante restado y lo que hay que comprar.", "Pulsa «Imprimir hoja de compra (A4)»: lleva una casilla por producto y huecos para el proveedor y lo comprado.", "«Hoja de carga» → «Imprimir hoja de carga (A4)»: lleva el peso y un hueco «falta» por línea.", "Las dos se pueden imprimir en papel, guardar en PDF o mandar por WhatsApp."], "resumen": "Las dos hojas las genera la app. Se imprimen y, si hace falta, se anota a mano sobre el papel, como siempre."}, {"id": "compra", "icono": "🧺", "grupo": "Compras y facturas", "titulo": "Qué comprar en Mercamadrid", "roles": "t", "ir": "hojacompra", "antes": "Alguien sumaba todos los pedidos a mano para saber cuánto comprar.", "ahora": "La app suma los pedidos del día y resta lo que sobró. Esa es tu lista de la compra.", "pasos": ["Entra en «Hoja de compra» y elige la fecha.", "Cada producto muestra: cuánto está pedido, cuánto sobra y cuánto hay que comprar.", "Imprímela o mírala en el móvil mientras compras.", "El personal de compras tiene también «Compras» → «Qué comprar», con más detalle."], "resumen": "La app suma los pedidos del día y resta lo que sobró. Esa es tu lista de la compra."}, {"id": "quien", "icono": "🛒", "grupo": "Compras y facturas", "titulo": "A quién hemos comprado hoy", "roles": "t", "ir": "quien", "antes": "El proveedor de cada cosa estaba en la cabeza de quien compraba o en la factura, que luego había que buscar.", "ahora": "Al comprar, cualquiera anota el nombre del puesto de Mercamadrid donde compró cada producto. Con eso se hace la trazabilidad y las facturas.", "pasos": ["Entra en «A quién compramos hoy».", "Para cada producto, escribe o elige el proveedor. No hace falta saber qué es un lote.", "Se puede dejar en blanco: no da error y los albaranes se pueden hacer igualmente. La oficina lo completará después.", "Esto es lo que luego permite saber de dónde salió cada producto si hay que responder a una inspección o a una reclamación."], "resumen": "Al comprar, cualquiera anota el nombre del puesto de Mercamadrid donde compró cada producto. Con eso se hace la trazabilidad y las facturas."}, {"id": "compras_reg", "icono": "🛍️", "grupo": "Compras y facturas", "titulo": "Registrar compras, lotes y precios de compra", "roles": "c", "ir": "compras", "antes": "Los albaranes y facturas de proveedores se guardaban en papel o en el correo, y para saber a cuánto salía un producto había que buscar.", "ahora": "Cada compra queda registrada con su proveedor, su lote y su precio. Se ve la evolución del precio de compra.", "pasos": ["Entra en «Compras» → «Registrar compra». Elige proveedor, fecha y productos con cantidades y precios.", "«Lotes»: cada producto comprado queda como lote. Es la base de la trazabilidad.", "«Sin factura»: compras todavía sin su factura. Se adjunta el archivo cuando llegue.", "«Precios de compra» (en Inicio) muestra cómo cambian por día y por producto."], "resumen": "Cada compra queda registrada con su proveedor, su lote y su precio. Se ve la evolución del precio de compra."}, {"id": "frecibidas", "icono": "📬", "grupo": "Compras y facturas", "titulo": "Facturas de proveedores que llegan por correo", "roles": "c", "ir": "compras", "antes": "Los proveedores mandaban las facturas por correo (Hotmail) y alguien las abría, las imprimía o las guardaba y las buscaba cuando hacían falta.", "ahora": "Todas las facturas con archivo adjunto que llegan por correo se cargan solas en la app. Nadie tiene que abrirlas ni guardarlas.", "pasos": ["Los correos de los proveedores con factura se reenvían a la cuenta de facturas de Ferjusanz (una regla en el correo, que se hace una sola vez).", "Cada 10 minutos la app revisa esa cuenta y sube a «Compras» → «Recibidas» todo lo que lleve un archivo adjunto.", "Tú solo entras en «Recibidas» y enlazas cada factura con su compra o proveedor con un toque.", "Si no es una factura, pulsa «Descartar».", "Las facturas no se pierden ni se repiten: si llega dos veces la misma, solo se guarda una.", "Los correos originales siguen en el correo de siempre; el reenvío es solo una copia."], "resumen": "Todas las facturas con archivo adjunto que llegan por correo se cargan solas en la app. Nadie tiene que abrirlas ni guardarlas."}, {"id": "lector_facturas", "icono": "🧾", "grupo": "Compras y facturas", "titulo": "Lector de facturas de proveedores", "roles": "c", "ir": "compras", "antes": "Las facturas de proveedor se miraban a mano para saber qué costó cada cosa.", "ahora": "Subes la factura (PDF o foto): la app lee productos, cantidades y precios, recuerda qué artículo es cada producto para ese proveedor y guarda el precio de compra.", "pasos": ["Entra en «Facturas de proveedores» y abre la factura recibida.", "Pulsa leer factura y revisa líneas y precios.", "Si un artículo no se reconoce, elige el producto una vez: queda recordado para ese proveedor.", "La app comprueba si la suma de las líneas leídas cuadra con la base imponible de la factura y avisa si no (⚠ NO cuadra). Si una línea no trae precio, lo calcula y lo marca para revisarlo.", "Guarda: el precio de compra pasa a la casilla de coste y a la ganancia.", "Si la factura aún no ha llegado, no pasa nada: pon los precios de venta igualmente.", "Entiende descuentos (%), descripciones partidas en dos filas y números mal leídos en fotos. Las filas que no entiende te las avisa para que las añadas a mano."], "resumen": "Lector de facturas: lee, recuerda artículos y guarda precios de compra."}, {"id": "traza", "icono": "🔎", "grupo": "Compras y facturas", "titulo": "Trazabilidad: de dónde sale cada producto", "roles": "o", "ir": "traza", "antes": "Para saber a quién se había entregado un producto comprado en un puesto concreto había que revisar papeles.", "ahora": "La app propone de qué compra sale cada línea entregada. La oficina revisa y confirma. Si hay que investigar un lote, se ve a qué clientes llegó.", "pasos": ["Entra en «Trazabilidad» → «Confirmar trazabilidad».", "La app propone el lote de cada línea (el más antiguo primero). En naranja están las que tienen varios lotes posibles: revísalas.", "Confirma pedido a pedido. Si falta información, puedes dejarlo «sin trazabilidad» indicando el motivo.", "Las ventas en ruta aparecen aquí pendientes de asignar lote.", "Para buscar: «Por lote», «Por cliente» o «Para factura»."], "resumen": "La app propone de qué compra sale cada línea entregada. La oficina revisa y confirma. Si hay que investigar un lote, se ve a qué clientes llegó."}, {"id": "cobros", "icono": "💶", "grupo": "Dinero", "titulo": "Cobros, caja y deudas", "roles": "t", "ir": "cobros", "antes": "Los cobros se apuntaban en papel y las deudas se llevaban de memoria o en cuadernos.", "ahora": "Cada cobro se apunta en el momento. La app sabe qué falta por cobrar de cada albarán y de cada cliente.", "pasos": ["«Cobros» → «Pendientes de cobro»: los albaranes que aún no están cobrados. Filtra por vencidos, contado o crédito.", "Para cobrar: abre el albarán y apunta el importe y la forma de pago. Se pueden hacer cobros parciales.", "«Caja del día» (oficina): lo cobrado en el día.", "«Deudas»: por albarán o por cliente, y lo que se debe a proveedores (solo compras y oficina). Todos pueden ver quién debe."], "resumen": "Cada cobro se apunta en el momento. La app sabe qué falta por cobrar de cada albarán y de % o un precio y ves lo que ganas por producto."], "resumen": "Ganancia: precio de compra al lado del de venta, tarjeta por pedido y calculadora. Solo equipo, no en el albarán del cliente."}, {"id": "fclientes", "icono": "📄", "grupo": "Dinero", "titulo": "Facturas de clientes", "roles": "o", "ir": "facturascli", "antes": "Las facturas se hacen en Golden y no había forma rápida de ver las de un cliente.", "ahora": "Golden sigue haciendo la factura. En la app se apunta cada una (número, fecha, importe) para consultarla por cliente y saber si está cobrada.", "pasos": ["Entra en «Facturas de clientes» y pulsa «+ Añadir factura»: cliente, número, fecha e importe. Puedes adjuntar el PDF o una foto.", "Filtra por «Pendientes de cobro» o «Cobradas». Al tocar una factura puedes marcarla cobrada, ver el archivo o quitarla de la lista.", "En «Clientes», el botón «▾ Facturas» de cada cliente despliega sus facturas. También hay una pestaña «Facturas» dentro de su ficha."], "resumen": "Golden sigue haciendo la factura. En la app se apunta cada una (número, fecha, importe) para consultarla por cliente y saber si está cobrada."}, {"id": "golden", "icono": "🗂️", "grupo": "Dinero", "titulo": "Histórico de Golden (facturas ya hechas)", "roles": "o", "ir": "golden", "antes": "Para ver una factura antigua había que abrir Golden en el ordenador de la oficina y buscarla.", "ahora": "Todas las facturas de 2026 que ya están en Golden se pueden consultar desde la app, en el móvil, por cliente, por número o por producto.", "pasos": ["Entra en «Histórico de Golden» (en Inicio, dentro de «Clientes y productos»).", "«Facturas»: lista de todas, con buscador por cliente o por número. Toca una para ver todos sus productos, cantidades, precios e IVA.", "«Por cliente»: cuánto se ha facturado a cada cliente en 2026. Toca uno para ver sus facturas.", "«Por producto»: escribe un producto (por ejemplo, tomate pera) y verás cuánto se ha vendido y cuánto dinero ha supuesto.", "Puedes filtrar por mes. Los bo async function buscar(tabla, texto, soloActivos, limite) {
  let q = sb.from(tabla).select('*').limit(limite || 15);
  const t = limpiaBusqueda(texto);
  if (t) q = q.or(tabla === 'clientes'
    ? 'nombre.ilike.%' + t + '%,nombre_comercial.ilike.%' + t + '%,codigo.ilike.%' + t + '%'
    : 'nombre.ilike.%' + t + '%,codigo.ilike.%' + t + '%');
  if (soloActivos) q = q.eq('activo', true);
  const { data, error } = await q.order('nombre');
  if (error) throw error; return data;
}

/* Hoja de precios con buen diseño.

function pdfListaPrecios(d) {
  const doc = pdfNuevo(); const W = doc.W, H = doc.H, M = 40, VERDE = '#166534', VERDE2 = '#dcfce7', GRIS = '#6b7280', OSC = '#111827';
  const precioTxt = (p, u) => (p == null || p === '' || isNaN(Number(p))) ? '' : Number(p).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 3 }).replace(/(,\d\d)0$/, '$1') + ' € / ' + (u || 'kg');
  let y = 0;
  const cabecera = grande => {

      doc.texto('FERJUSANZ', M, 52, 30, { neg: true, color: '#ffffff' });
      doc.texto('Frutas y verduras al por mayor · Mercamadrid', M, 70, 10.5, { color: '#dcfce7' });
      pdfLineas(d.titulo || 'Lista de precios', 22, true, W - 2 * M).slice(0, 2).forEach((l, i) => doc.texto(l, M, 102 + i * 24, 22, { neg: true, color: '#ffffff' }));
      y = 152;
      if (d.subtitulo) { pdfLineas(d.subtitulo, 11.5, false, W - 2 * M).slice(0, 2).forEach(l => { doc.texto(l, M, y, 11.5, { color: GRIS }); y += 15; }); y += 2; }
      if (d.validez) { doc.texto(d.validez, M, y, 10, { neg: true, color: VERDE }); y += 16; }
      y += 6;
    } else {
      doc.rect(0, 0, W, 34, VERDE); doc.texto('FERJUSANZ', M, 22, 13, { neg: true, color: '#ffffff' });
      doc.texto(d.titulo || '', W - M, 22, 10.5, { color: '#dcfce7', align: 'right' }); y = 56;
    }

  const hayRecs = (d.recs || []).length > 0;
  cabecera(true);
  const tarjetas = () => {
    if (!hayRecs) return;
    doc.texto('NUESTRAS RECOMENDACIONES', M, y + 4, 12, { neg: true, color: VERDE }); y += 14;
    const cw = (W - 2 * M - 12) / 2; let col = 0, filaY = y, altoFila = 0;
    const lista = d.recs.slice(0, d.soloRecs ? 40 : 8);
    lista.forEach((r, i) => {
      const tl = pdfLineas(r.titulo || '', 12, true, cw - 24).slice(0, 2);
      const xl = pdfLineas(r.texto || '', 9, false, cw - 24).slice(0, d.soloRecs ? 5 : 3);
      const alto = 16 + tl.length * 15 + xl.length * 11.5 + (r.precio != null && r.precio !== '' ? 26 : 8);
      if (col === 0) { /* ¿cabe la fila? se calcula con la siguiente también */
        const sig = lista[i + 1]; let a2 = 0;
        if (sig) { const t2 = pdfLineas(sig.titulo || '', 12, true, cw - 24).slice(0, 2), x2 = pdfLineas(sig.texto || '', 9, false, cw - 24).slice(0, d.soloRecs ? 5 : 3); a2 = 16 + t2.length * 15 + x2.length * 11.5 + (sig.precio != null && sig.precio !== '' ? 26 : 8); }
        altoFila = Math.max(alto, a2);
        if (filaY + altoFila > H - 80) { doc.pagina(); cabecera(false); filaY = y; }
      }
      const x = M + col * (cw + 12);
      doc.caja(x, filaY, cw, altoFila, '#f0fdf4', '#86efac'); doc.rect(x, filaY, 4, altoFila, VERDE);
      let yy = filaY + 20; tl.forEach(l => { doc.texto(l, x + 14, yy, 12, { neg: true, color: OSC }); yy += 15; });
      xl.forEach(l => { doc.texto(l, x + 14, yy - 1, 9, { color: '#374151' }); yy += 11.5; });
      if (r.precio != null && r.precio !== '') doc.texto(precioTxt(r.precio, r.unidad), x + 14, filaY + altoFila - 9, 13, { neg: true, color: VERDE });
      if (col === 1 || i === lista.length - 1) { filaY += altoFila + 10; col = 0; } else col = 1;
    });
    y = filaY + 6;
  };
  tarjetas();
  if (!d.soloRecs) {
    const items = d.items || [];
    const cab = () => {
      doc.rect(M, y, W - 2 * M, 22, VERDE);
      doc.texto('PRODUCTO', M + 10, y + 15, 9.5, { neg: true, color: '#ffffff' });
      doc.texto('PRECIO', W - M - 10, y + 15, 9.5, { neg: true, color: '#ffffff', align: 'right' }); y += 22;
    };
    if (items.length) {
      if (y > H - 140) { doc.pagina(); cabecera(false); }
      cab(); let z = 0;
      items.forEach(it => {
        const nl = pdfLineas(it.nombre || '', 10.5, false, W - 2 * M - 170).slice(0, 2); const alto = 6 + Math.max(1, nl.length) * 13 + (it.nota ? 11 : 0) + 4;

        if (it.nota) doc.texto(it.nota, M + 10, yy - 1, 8.5, { color: GRIS });
        doc.texto(precioTxt(it.precio, it.unidad), W - M - 10, y + 15, 11, { neg: true, color: VERDE, align: 'right' });

      doc.linea(M, y, W - M, y, VERDE, 1);

  const pieL = pdfLineas(d.pie || '', 8.5, false, W - 2 * M).slice(0, 3);
  for (let i = 0; i < n; i++) {
    doc.enPagina(i, () => {
      doc.linea(M, H - 58, W - M, H - 58, '#d1d5db', 0.6);
      pieL.forEach((l, k) => doc.texto(l, M, H - 45 + k * 10.5, 8.5, { color: GRIS }));
      if (d.contacto) doc.texto(d.contacto, M, H - 14, 9.5, { neg: true, color: VERDE });
      doc.texto('Página ' + (i + 1) + ' de ' + n, W - M, H - 14, 8.5, { color: GRIS, align: 'right' });
    });
  }
  return doc.bytes();
}

      kids.push(grupo('Sobrante (existencias sin vender)', (out.sobra || []).slice(0, 5).map(s => fila((mapP[s.producto_id] ? mapP[s.producto_id].nombre : '') + ' · ' + num(s.cantidad) + ' ' + s.unidad, fechaES(s.fecha), () => go('carga')))));
      const k = kids.filter(Boolean); info.textContent = k.length ? '' : 'Sin resultados para «' + texto.trim() + '».';
      res.replaceChildren(...k);
    } catch (e) { if (mi === seq) { info.textContent = ''; res.replaceChildren(h('p', { class: 'err' }, msgErr(e))); } }
  }
  if (inp.value.trim()) buscarTodo(inp.value);
  setTimeout(() => inp.focus(), 100);
}

/* =====================  ARRANQUE  ===================== */
function render() {
  { const t = document.getElementById('tip'); if (t) t.remove(); }
  clearInterval(state.chatTimer); state.chatTimer = null;
  if (!state.user) return vistaLogin();
  if (!state.perfil) return vistaSinPerfil();
  const v = { comercial: vistaComercial, preciosp: vistaPreciosPend, formatos: vistaFormatos, copia: vistaCopia, lista: vistaLista, pedido: vistaPedido, nuevo: vistaNuevo, catalogo: vistaCatalogo, albaran: vistaAlbaran, carga: vistaCarga, clientes: vistaClientes, cliente: vistaCliente, chat: vistaChat, perfil: vistaPerfil, fichajes: vistaFichajes, mas: vistaMas, inicio: vistaMas, cobros: vistaCobros, compras: vistaCompras, traza: vistaTraza, quien: vistaQuien, registro: vistaRegistro, albaranes: vistaAlbaranes, entregas: vistaEntregas, calendario: vistaCalendario, incidencias: vistaIncidencias, precios: vistaPrecios, facturas: vistaFacturas, facturascli: vistaFacturasCli, ayuda: vistaAyuda, golden: vistaGolden, pedidos: vistaPedidos, hojacompra: vistaHojaCompra, resumen: vistaResumen, archivo: vistaArchivo, avisos: vistaAvisos, ruta: vistaRuta, reparto: vistaReparto, prefacturas: vistaPrefacturas, rentabilidad: vistaRentabilidad, deudas: vistaDeudas, importar: vistaImportar, buscar: vistaBuscar }[state.view] || vistaLista;
  v();
  try { if (state.view === 'inicio' && !sinTours() && !LS.get(tourClave(), 0)) mostrarTour(); else mostrarTip(); } catch (e) { }
}
function tick() {
  if (!state.user || !state.perfil) return;
  renderBanner();
  if (!navigator.onLine) return;
  sincronizar(); sincronizarCarga(); sincronizarFichaje(); sincronizarCobros(); sincronizarEntregas(); sincronizarFirmas(); sincronizarInc(); comprobarEntregas(); if (state.view !== 'chat') contarChat();
  if (!document.hidden && !state.sheetAbierta) refrescarVista();
}
async function init() {
  if (!sb) {
    $app.replaceChildren(h('div', { class: 'login' }, h('h1', {}, 'Ferjusanz'),
      h('p', {}, 'No se ha podido cargar la aplicación. Conéctate a internet y vuelve a intentarlo.'),
      h('button', { onclick: () => location.reload() }, 'Reintentar')));
    return;
  }
  let ses = null;
  try { const r = await Promise.race([sb.auth.getSession(), new Promise((_, no) => setTimeout(() => no(new Error('tiempo')), 5000))]); ses = r && r.data && r.data.session; } catch (e) { }
  if (ses) await cargarPerfil(ses.user);
  else if (!PRACTICA) { const sl = sesionLocal(), pl = LS.get('fj_perfil', null); if (sl && pl && pl.id === sl.user.id) { state.user = sl.user; state.perfil = pl; } }
  aplicarCompartido(); render(); cargarGente();
  try { history.replaceState(navSnap(0), ''); } catch (e) { }
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { state.user = null; state.perfil = null; render(); } });
  window.addEventListener('online', () => { renderBanner(); sincronizar(); sincronizarCarga(); sincronizarFichaje(); sincronizarCobros(); sincronizarEntregas(); sincronizarFirmas(); sincronizarInc(); refrescarVista(); });
  window.addEventListener('offline', renderBanner);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  setInterval(tick, 8000);
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => { }); navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.ir === 'recib' && state.user) { LS.set('fj_compras_modo', 'recib'); go('compras'); } }); }
}
init();
</script>
