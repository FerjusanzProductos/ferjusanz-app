const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const fechaES = iso => { if (!iso) return ''; const [y, m, d] = String(iso).slice(0, 10).split('-'); return d + '/' + m + '/' + y; };

const limpiaBusqueda = s => String(s).replace(/[,()%*\\]/g, ' ').trim();

/* =====================  GENTE, FOTOS Y HORAS  ===================== */
state.gente = (function () { try { return JSON.parse(localStorage.getItem('fj_gente') || '{}'); } catch (e) { return {}; } })();
async function cargarGente() {

  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);

const fmtHora = iso => new Date(iso).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

const aLocalInput = iso => { const d = new Date(iso); return hoy(d) + 'T' + d.toTimeString().slice(0, 5); };

/* =====================  COLA SIN CONEXIÓN  ===================== */
const getCola = () => LS.get('fj_cola', []);
function setCola(c) { LS.set('fj_cola', c); renderBanner(); }

let syncing = false, again = false;
async function sincronizar() {
  if (!navigator.onLine || !getCola().length) return;

    do {

  if (soloActivos) q = q.eq('activo', true);
  const { data, error } = await q.order('nombre');
  if (error) throw error; return data;
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function vistaNuevo() {
  state.view = 'nuevo';
  const nuevo = { cliente: null, fecha: hoy(), lineas: [], notas: '' };
  const raiz = h('div', {});
  $app.replaceChildren(shell('Nuevo pedido', raiz)); renderBanner();

  const cliBox = h('div', {}); const lineasBox = h('div', {}); const prodBox = h('div', {});
  const fechaInp = h('input', { type: 'date', value: nuevo.fecha, onchange: e => nuevo.fecha = e.target.value });
  const notas = h('textarea', { rows: 2, placeholder: 'Notas del pedido (opcional)', oninput: e => nuevo.notas = e.target.value });
  const btnGuardar = h('button', { style: 'width:100%;margin-top:6px', onclick: guardarPedido }, 'Guardar pedido');

  function pintarCliente() {
    if (nuevo.cliente) {
      cliBox.replaceChildren(h('div', { class: 'card fila' }, h('div', {}, h('div', { class: 'nombre' }, nombreCli(nuevo.cliente)), h('div', { class: 'sub' }, nuevo.cliente.codigo + ' · ' + (nuevo.cliente.forma_pago === 'contado' ? 'Contado' : 'Crédito'))),
        h('button', { class: 'ghost small', onclick: () => { nuevo.cliente = null; pintarCliente(); } }, 'Cambiar')));
      return;
    }
    const res = h('div', {});
    const inp = h('input', { placeholder: 'Buscar cliente (nombre o código)…', oninput: debounce(async () => {
      try { const r = await buscar('clientes', inp.value, true, 12);
        res.replaceChildren(r.length ? h('div', { class: 'res' }, r.map(c => h('button', { onclick: () => { nuevo.cliente = c; pintarCliente(); } }, nombreCli(c) + '  ·  ' + c.codigo))) : h('p', { class: 'sub' }, 'Sin resultados entre los clientes activos. Actívalo en Catálogo.'));
      } catch (e) { res.replaceChildren(h('p', { class: 'err' }, msgErr(e))); } }, 250) });
    cliBox.replaceChildren(inp, res);
  }
  function pintarLineas() {
    lineasBox.replaceChildren(...nuevo.lineas.map((l, i) => h('div', { class: 'card' },
      h('div', { class: 'fila' }, h('div', { class: 'nombre' }, l.producto.nombre), h('button', { class: 'peligro small', onclick: () => { nuevo.lineas.splice(i, 1); pintarLineas(); } }, 'Quitar')),
      h('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px' },
        h('label', { class: 'campo' }, 'Cantidad', h('input', { type: 'text', inputmode: 'decimal', value: l.cantidad, oninput: e => l.cantidad = e.target.value })),
        h('label', { class: 'campo' }, 'Unidad', h('select', { onchange: e => l.unidad = e.target.value }, UNIDADES.map(u => h('option', { value: u, selected: u === l.unidad }, u)))),
        h('label', { class: 'campo' }, 'Se cobra por', h('select', { onchange: e => l.unidad_precio = e.target.value }, ['kg', 'unidad'].map(u => h('option', { value: u, selected: u === l.unidad_precio }, u)))),
        h('label', { class: 'campo' }, 'Precio (€)', h('input', { type: 'text', inputmode: 'decimal', value: l.precio, placeholder: 'opcional', oninput: e => l.precio = e.target.value }))))));
  }
  function pintarBuscadorProducto() {
    const res = h('div', {});
    const inp = h('input', { placeholder: 'Añadir producto (nombre o código)…', oninput: debounce(async () => {
      if (!inp.value.trim()) { res.replaceChildren(); return; }
      try { const r = await buscar('productos', inp.value, true, 12);
        res.replaceChildren(r.length ? h('div', { class: 'res' }, r.map(p => h('button', { onclick: async () => {
          const linea = { producto: p, cantidad: '', unidad: p.unidad_venta, unidad_precio: p.unidad_precio, precio: '' };
          nuevo.lineas.push(linea); pintarLineas(); inp.value = ''; res.replaceChildren();
          if (nuevo.cliente) { try { const t = await sb.from('tarifas').select('precio,cliente_id,desde').eq('producto_id', p.id).order('desde', { ascending: false }).limit(20);
            const m = (t.data || []).find(x => x.cliente_id === nuevo.cliente.id) || (t.data || []).find(x => !x.cliente_id);
            if (m) { linea.precio = String(m.precio).replace('.', ','); pintarLineas(); } } catch (e) { } }
        } }, p.nombre + '  ·  ' + p.codigo))) : h('p', { class: 'sub' }, 'Sin resultados entre los productos activos. Actívalo en Catálogo.'));
      } catch (e) { res.replaceChildren(h('p', { class: 'err' }, msgErr(e))); } }, 250) });
    prodBox.replaceChildren(inp, res);
  }
  async function guardarPedido() {
    if (!nuevo.cliente) { toast('Elige un cliente', 'err'); return; }
    if (!nuevo.lineas.length) { toast('Añade al menos un producto', 'err'); return; }
    const filas = [];
    for (const l of nuevo.lineas) {
      const c = parseNum(l.cantidad); if (c === null || c <= 0) { toast('Falta la cantidad de ' + l.producto.nombre, 'err'); return; }
      const pr = String(l.precio).trim() === '' ? null : parseNum(l.precio);
      if (pr !== null && pr < 0) { toast('Precio no válido en ' + l.producto.nombre, 'err'); return; }
      filas.push({ producto_id: l.producto.id, cantidad_pedida: c, unidad_pedida: l.unidad, unidad_precio: l.unidad_precio, precio: pr });
    }
    btnGuardar.disabled = true;
    const ped = await sb.from('pedidos').insert({ cliente_id: nuevo.cliente.id, fecha_entrega: nuevo.fecha, notas: nuevo.notas || null }).select('id').single();
    if (ped.error) { btnGuardar.disabled = false; toast(msgErr(ped.error), 'err'); return; }
    const li = await sb.from('lineas_pedido').insert(filas.map(f => Object.assign({ pedido_id: ped.data.id }, f)));
    if (li.error) { await sb.from('pedidos').delete().eq('id', ped.data.id); btnGuardar.disabled = false; toast(msgErr(li.error), 'err'); return; }
    toast('Pedido guardado', 'ok'); state.fecha = nuevo.fecha; go('lista');
  }
  raiz.append(
    h('label', { class: 'campo' }, 'Cliente'), cliBox,
    h('label', { class: 'campo', style: 'margin-top:10px' }, 'Fecha de entrega', fechaInp),
    h('label', { class: 'campo' }, 'Productos'), lineasBox, prodBox,
    h('div', { style: 'margin-top:12px' }, notas), btnGuardar);
  pintarCliente(); pintarLineas(); pintarBuscadorProducto();
}

/* =====================  CATÁLOGO (oficina)  ===================== */
function vistaCatalogo() {
  state.view = 'catalogo';
  let tabla = LS.get('fj_cat_tabla', 'productos');
  const lista = h('div', {}); const info = h('p', { class: 'sub' });
  const inp = h('input', { placeholder: 'Buscar por nombre o código…', oninput: debounce(cargar, 250) });
  const bProd = h('button', { class: 'chip', onclick: () => { tabla = 'productos'; LS.set('fj_cat_tabla', tabla); marca(); cargar(); } }, 'Productos');
  const bCli = h('button', { class: 'chip', onclick: () => { tabla = 'clientes'; LS.set('fj_cat_tabla', tabla); marca(); cargar(); } }, 'Clientes');
  function marca() { bProd.className = 'chip' + (tabla === 'productos' ? ' on' : ''); bCli.className = 'chip' + (tabla === 'clientes' ? ' on' : ''); }
  async function guardarCampo(fila, cambios, ctl) {
    const { error } = await sb.from(tabla).update(cambios).eq('id', fila.id);
    if (error) { toast(msgErr(error), 'err'); cargar(); return; }
    Object.assign(fila, cambios); toast('Guardado', 'ok');
  }
  async function cargar() {
    marca();
    const t = inp.value.trim();
    try {
      const r = await buscar(tabla, t, !t, t ? 40 : 100);
      let gen = {};
      if (tabla === 'productos' && r.length) { const g = await sb.from('tarifas').select('producto_id,precio,desde').is('cliente_id', null).in('producto_id', r.map(x => x.id)).order('desde', { ascending: false }); (g.data || []).forEach(x => { if (gen[x.producto_id] == null) gen[x.producto_id] = x.precio; }); }
      info.textContent = t ? r.length + ' resultados (máximo 40)' : r.length + ' ' + tabla + ' activos (escribe para buscar entre todos)';
      lista.replaceChildren(...(r.length ? r.map(f => {
        const check = h('input', { type: 'checkbox', checked: f.activo, onchange: e => guardarCampo(f, { activo: e.target.checked }) });
        const ctl = [h('label', { class: 'interruptor' }, check, 'Activo')];
        if (tabla === 'productos') {
          ctl.push(h('select', { onchange: e => guardarCampo(f, { unidad_venta: e.target.value }) }, UNIDADES.map(u => h('option', { value: u, selected: u === f.unidad_venta }, 'Se vende en ' + u))));
          ctl.push(h('select', { onchange: e => guardarCampo(f, { unidad_precio: e.target.value }) }, ['kg', 'unidad'].map(u => h('option', { value: u, selected: u === f.unidad_precio }, 'Precio por ' + u))));
          ctl.push(h('input', { type: 'text', inputmode: 'decimal', placeholder: 'Precio general €', value: gen[f.id] != null ? String(gen[f.id]).replace('.', ',') : '', style: 'width:130px;min-height:42px', onchange: async e => { const n = parseNum(e.target.value); if (n === null || n < 0) { toast('Precio no válido', 'err'); return; } if (await guardarTarifa(f.id, null, n)) toast('Precio general guardado', 'ok'); } }));
          ctl.push(h('select', { onchange: e => guardarCampo(f, { iva: Number(e.target.value) }) }, [4, 10, 21, 0].map(v => h('option', { value: v, selected: v === Number(f.iva != null ? f.iva : 4) }, 'IVA ' + v + ' %'))));
        } else {
          ctl.push(h('select', { onchange: e => guardarCampo(f, { forma_pago: e.target.value }) }, [['credito', 'Crédito'], ['contado', 'Contado']].map(([v, n]) => h('option', { value: v, selected: v === f.forma_pago }, n))));
          ctl.push(h('input', { placeholder: 'Ruta (ej. R1)', value: f.ruta || '', style: 'width:130px;min-height:42px', onchange: e => guardarCampo(f, { ruta: e.target.value.trim() || null }) }));
        }
        return h('div', { class: 'card rowcat' }, h('div', {}, h('div', { class: 'nombre' }, tabla === 'clientes' ? nombreCli(f) : f.nombre), h('div', { class: 'sub' }, f.codigo)), h('div', {}), h('div', { class: 'controles' }, ctl));
      }) : [h('p', { class: 'vacio' }, 'Nada que mostrar.')]));
    } catch (e) { lista.replaceChildren(h('p', { class: 'err' }, msgErr(e))); }
  }
  $app.replaceChildren(shell('Catálogo', h('div', {}, h('div', { class: 'chips' }, bProd, bCli), inp, info, lista)));
  renderBanner(); cargar();
}

/* =====================  ARRANQUE  ===================== */
function render() {
  clearInterval(state.chatTimer); state.chatTimer = null;
  if (!state.user) return vistaLogin();
  if (!state.perfil) return vistaSinPerfil();
  const v = { lista: vistaLista, pedido: vistaPedido, nuevo: vistaNuevo, catalogo: vistaCatalogo, albaran: vistaAlbaran, carga: vistaCarga, clientes: vistaClientes, cliente: vistaCliente, chat: vistaChat, perfil: vistaPerfil, fichajes: vistaFichajes, mas: vistaMas, cobros: vistaCobros, compras: vistaCompras, traza: vistaTraza }[state.view] || vistaLista;
  if ((state.view === 'nuevo' || state.view === 'catalogo') && !esOficina()) return vistaLista();
  v();
}
function tick() {
  if (!state.user || !state.perfil) return;
  renderBanner();
  if (!navigator.onLine) return;
  sincronizar(); sincronizarCarga(); sincronizarFichaje(); sincronizarCobros(); if (state.view !== 'chat') contarChat();
  if (!document.hidden && !state.sheetAbierta) refrescarVista();
}
async function init() {
  if (!sb) {
    $app.replaceChildren(h('div', { class: 'login' }, h('h1', {}, 'Ferjusanz'),
      h('p', {}, 'No se ha podido cargar la aplicación. Conéctate a internet y vuelve a intentarlo.'),
      h('button', { onclick: () => location.reload() }, 'Reintentar')));
    return;
  }
  try { const { data } = await sb.auth.getSession(); if (data && data.session) await cargarPerfil(data.session.user); } catch (e) { }
  render(); cargarGente();
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { state.user = null; state.perfil = null; render(); } });
  window.addEventListener('online', () => { renderBanner(); sincronizar(); sincronizarCarga(); sincronizarFichaje(); sincronizarCobros(); refrescarVista(); });
  window.addEventListener('offline', renderBanner);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  setInterval(tick, 8000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
}
init();
</script>
