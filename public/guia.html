<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guía de la app de Ferjusanz</title>
<style>
:root{--bg:#f6f7f4;--fg:#1d2a1f;--card:#fff;--ac:#2e7d32;--mut:#5b6b5e;--bd:#dfe5dc}
@media(prefers-color-scheme:dark){:root{--bg:#121712;--fg:#e8efe8;--card:#1b231c;--mut:#a3b3a5;--bd:#2c382d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif}
header{background:var(--ac);color:#fff;padding:18px 16px}header h1{margin:0;font-size:21px}header p{margin:4px 0 0;opacity:.9;font-size:14px}
main{max-width:720px;margin:0 auto;padding:12px 16px 40px}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:var(--card);color:var(--fg);margin:6px 0 12px}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:8px 0;padding:0 14px}
summary{padding:14px 0;font-weight:700;cursor:pointer}
summary small{font-weight:400;color:var(--mut);display:block}
ol{padding-left:20px}li{margin:8px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;margin:4px 6px 14px 0}
.antes,.ahora{border-radius:10px;padding:10px 12px;margin:6px 0;font-size:15px}.antes{background:#fef3c7;color:#422006}.ahora{background:#dcfce7;color:#052e16}
.tag{font-size:12px;background:var(--bd);border-radius:8px;padding:2px 8px;margin-left:6px;font-weight:400}
@media print{header{background:none;color:#000}button,input{display:none}details{border:0}details>*{display:block}}
</style></head><body>
<header><h1>Guía de la app de Ferjusanz</h1><p>Cómo hacer cada cosa, paso a paso</p></header>
<main><input id="q" type="search" placeholder="Buscar: pedido, albarán, sobrante, factura…">
<div id="l"></div></main>
<script>
const GUIA = [{"id": "reglas", "icono": "📏", "grupo": "Empezar", "titulo": "Reglas internas de productos y pedidos", "roles": "t", "ir": null, "antes": "Cada uno llamaba a los productos a su manera (patata agria, consumo, hostelería, nueva, jelly…) y en Golden se tecleaba lo que se entendía.", "ahora": "Un mismo nombre y código para cada cosa, igual en la app, en el albarán y en Golden Soft.", "pasos": ["PATATAS. La patata general (la de más volumen; en las facturas viene como P.C., consumo, hostelería, nueva o jelly) es AHORA «Patata nueva esp. freír» (código 09-F). Es la que se pone a todos los clientes que no piden agria.", "Dentro de unos meses, cuando la patata venga vieja, la general pasará a ser «Patata esp. freír» (código 01-F). El cambio lo hace la oficina de una vez para todos.", "La PATATA AGRIA (código 01) es solo para quien pide agria: se compra como agria y se vende como agria, con su propio precio.", "TOMATES. Pera, bola, ensalada, Rambo… se decide en el mercado según precio y calidad. Los tomates de los pedidos fijos son una estimación; la hoja de compra da el total de tomate para comprar por volumen. En las facturas: Daniela/Long Life = Tomate ensalada; Mar Azul = Tomate Azul; maduro = Tomate maduro; cherry pera/rama = Cherry.", "La Patata Monalisa es aparte (Lavandera y El Rincón Banchero llevan agria + Monalisa).", "Proveedores de patata habituales: sobre todo Ibérica, también Hermanos de Diego y Copace. La regla vale para todos.", "PEDIDOS FIJOS: salen solos como «PREVISTO» dos semanas antes. Se confirman el día antes (✅) o se quitan (❌). Cuentan ya en la hoja de compra.", "CLIENTES EN AZUL = sin IVA: se les aplica la línea «Descuento por productos». En DORADO = con IVA. El cliente nunca ve esa marca.", "FACTURAR: siempre en Golden Soft, copiando el código y el nombre de la copia ROSA del albarán."], "resumen": "Patata general ahora = Patata nueva esp. freír (09-F); más adelante = Patata esp. freír (01-F); agria solo si la piden (01). Previstos se confirman el día antes. Azul = sin IVA. Se factura en Golden."}, {"id": "empezar", "icono": "🚀", "grupo": "Empezar", "titulo": "Primeros pasos", "roles": "t", "ir": null, "antes": "Todo en papel y de palabra: pedidos apuntados a mano o por WhatsApp, hojas sueltas, albaranes escritos a mano.", "ahora": "Un solo sitio, en el móvil, donde está todo: pedidos, hoja de carga, albaranes, compras y facturas. Lo que apuntas lo ven los demás al momento.", "pasos": ["Abre el enlace de la app en Chrome e inicia sesión con tu correo y contraseña.", "Para tenerla como una app más: menú de Chrome (tres puntos) → «Instalar aplicación» o «Añadir a pantalla de inicio».", "Abajo tienes la barra con las pantallas principales. Arriba a la derecha: 🔍 Buscar, ❓ Ayuda y 💬 Chat del equipo.", "«Inicio» muestra todos los apartados en cuadros. Si no ves uno, es que no es para tu puesto.", "Si arriba pone «MODO PRÁCTICAS», los datos son de ejemplo y nada es real. Puedes probar sin miedo.", "Sin cobertura no pasa nada: la app guarda lo que haces y lo envía cuando vuelve la conexión."], "resumen": "Un solo sitio, en el móvil, donde está todo: pedidos, hoja de carga, albaranes, compras y facturas. Lo que apuntas lo ven los demás al momento."}, {"id": "roles", "icono": "🔑", "grupo": "Empezar", "titulo": "Quién ve qué", "roles": "t", "ir": null, "antes": "Cada uno apuntaba lo suyo en su papel; los precios y cuentas los llevaba la oficina.", "ahora": "Cada persona ve solo lo que necesita para su trabajo, así no se mezclan cosas ni se enseñan datos que no tocan.", "pasos": ["Preparadores y repartidores: preparan pedidos, cargan, entregan, anotan sobrante y a quién se ha comprado. No ven precios de compra, caja ni rentabilidad.", "Compras: además ven las compras, los precios de compra, los lotes y las facturas de proveedores.", "Oficina: ven y gestionan todo lo del día a día: pedidos, albaranes, cobros, trazabilidad, facturas de clientes y el registro de cambios.", "Administrador: además hace la copia de seguridad y gestiona los usuarios.", "Todos ven «Deudas» (quién debe qué), para saber a quién reclamar al entregar."], "resumen": "Cada persona ve solo lo que necesita para su trabajo, así no se mezclan cosas ni se enseñan datos que no tocan."}, {"id": "dia", "icono": "📆", "grupo": "Día a día", "titulo": "Un día de trabajo, de principio a fin", "roles": "t", "ir": null, "antes": "Se escribían los pedidos el día anterior o antes; se hacía una hoja de compra para todos; se compraba; se preparaba mientras se apuntaban pesos y faltas en la hoja de carga; se cargaba; cada repartidor se llevaba los albaranes de sus clientes; se repartía y se apuntaba el sobrante.", "ahora": "Los mismos pasos, pero cada papel lo genera la app a partir de los pedidos. Se escribe una sola vez y todo lo demás sale solo.", "pasos": ["1. Pedidos: la oficina los apunta en «Escribir pedido» (pegando el WhatsApp) o «Nuevo pedido», con la fecha de entrega que toque, aunque sea de aquí a varios días.", "2. Compra: en «Hoja de compra» eliges el día y sale lo que hay que comprar, restando el sobrante. Se imprime y se lleva a Mercamadrid.", "3. Al comprar: se anota a qué proveedor se ha comprado cada producto en «A quién compramos hoy» (puede quedar en blanco).", "4. Preparar: los preparadores abren cada pedido en «Preparar» y escriben lo preparado. Si falta algo, lo marcan.", "5. Carga: la «Hoja de carga» dice qué cargar en cada furgoneta; se marca lo cargado. Se puede imprimir.", "6. Albaranes: al terminar cada pedido se crea su albarán. Se imprime y cada repartidor se lleva los de sus clientes.", "7. Reparto: se entrega, se cobra si toca, y se apunta si se deja algo más (venta en ruta).", "8. Al volver: se anota el sobrante. Al día siguiente se descuenta solo de lo que hay que cargar y comprar.", "9. Oficina: confirma la trazabilidad, apunta las facturas y controla los cobros."], "resumen": "Los mismos pasos, pero cada papel lo genera la app a partir de los pedidos. Se escribe una sola vez y todo lo demás sale solo."}, {"id": "escribir", "icono": "✍️", "grupo": "Día a día", "titulo": "Apuntar un pedido rápido (con la memoria del cliente)", "roles": "t", "ir": "rapido", "antes": "Apuntar cada pedido llevaba mucho tiempo: buscar al cliente, buscar cada producto, escribir cada cantidad, una y otra vez.", "ahora": "Eliges el cliente y la app ya te enseña lo que suele pedir, con la cantidad y la unidad de siempre. Un botón pone «lo de siempre» y solo cambias lo distinto. Se acuerda sola: cuantos más pedidos guardas, mejor acierta.", "pasos": ["Entra en «Apuntar pedido» (Inicio › Trabajo diario).", "Escribe unas letras del cliente, o toca uno de «Últimos clientes».", "Elige «Hoy» o «Mañana» (la app recuerda la fecha que pusiste el último).", "Pulsa «↺ Lo de siempre» para poner sus productos habituales, o «Igual que el último» para copiar su último pedido. También puedes tocar el nombre de cada producto para poner su cantidad habitual, o usar − / +.", "Cambia solo lo que sea distinto. Si falta algún producto, escribe unas letras en «➕ Otro producto» (los que ya ha pedido salen primero con ★).", "Pulsa «Guardar pedido». Se queda listo para el siguiente cliente y arriba verás los que ya has apuntado.", "Si el pedido llega por WhatsApp, voz o foto, usa los botones «📋 Pegar WhatsApp», «🎤 Dictar» o «📷 Foto» de la misma pantalla."], "resumen": "Cliente → «Lo de siempre» → Guardar. La app se acuerda de lo que pide cada cliente."}, {"id": "nuevo", "icono": "🆕", "grupo": "Día a día", "titulo": "Crear un pedido a mano y pedidos habituales", "roles": "o", "ir": "nuevo", "antes": "Cada vez se volvía a escribir el pedido de los clientes que piden siempre lo mismo.", "ahora": "Los clientes fijos tienen su pedido «habitual» guardado: se crea con un botón.", "pasos": ["«Apuntar pedido» es la forma rápida. «Pedido clásico» (botón al final de esa pantalla) sirve para crear y guardar pedidos habituales.", "Para un cliente que repite: en su ficha, pestaña «Habituales», guarda su pedido de siempre y los días en que lo pide.", "En el «Calendario», al elegir un día, el botón «Crear pedidos habituales de este día» los crea todos de golpe.", "Los pedidos aparecen en «Preparar», en el calendario y en «Lista de pedidos»."], "resumen": "Los clientes fijos tienen su pedido «habitual» guardado: se crea con un botón."}, {"id": "pedidos", "icono": "📑", "grupo": "Día a día", "titulo": "Lista de pedidos y calendario", "roles": "t", "ir": "pedidos", "antes": "Había que buscar en las notas qué pedidos estaban apuntados y para qué día.", "ahora": "Ves todos los pedidos por fecha, estado y cliente, y los tocas para abrirlos.", "pasos": ["«Lista de pedidos»: elige «Desde» y «Hasta», filtra por estado y busca por cliente. Toca un pedido para abrirlo.", "«Calendario»: cada día muestra cuántos pedidos tiene; toca un día para verlos.", "Del calendario a la lista con «Ver como lista»; de la lista al calendario con «Ver en el calendario».", "La oficina puede anular un pedido equivocado (queda anotado, no se borra)."], "resumen": "Ves todos los pedidos por fecha, estado y cliente, y los tocas para abrirlos."}, {"id": "preparar", "icono": "📋", "grupo": "Día a día", "titulo": "Preparar un pedido", "roles": "t", "ir": "lista", "antes": "Se sacaba el género y se apuntaban pesos y faltas en la hoja; luego alguien lo pasaba a limpio para el albarán.", "ahora": "Escribes el peso o la cantidad de cada línea en el móvil. Al terminar, el albarán se crea solo, sin copiar nada.", "pasos": ["Entra en «Preparar» y elige el día arriba. Verás los pedidos de ese día.", "Toca el pedido que vas a preparar. Si otra persona ya lo lleva, la app te avisa.", "Toca cada línea y escribe lo preparado: kilos si se cobra por kilo, unidades si se cobra por unidad (caja, saco, docena…). Guarda.", "Si falta algo o no hay, márcalo en esa línea. No lo dejes sin marcar.", "Cuando todas las líneas están hechas, pulsa «Terminar y crear albarán». Si pone «Faltan X líneas», queda alguna sin marcar.", "Al guardar el último peso la app pasa sola a la siguiente línea sin anotar. Cuando no queda ninguna sale «✔ Todo preparado» con el botón «Confirmar y crear albarán»; si falta alguna, te dice cuáles.", "Si un pedido no se apuntó bien: arriba tienes «✏️ Editar» (cantidades, cliente, fecha), «➕ Añadir» (producto que faltaba) y «🗑 Borrar» (quita el pedido entero; queda anotado en el registro).", "Si un producto no ha llegado: toca la línea y pulsa «🗑 No ha llegado / quitar».", "Si un producto aún no lo tienes pero quieres seguir: toca la línea y pulsa «🛒 Se compra después». Puedes terminar el pedido, pero la app te avisa de que ese producto no saldrá en el albarán. Cuando llegue, toca la línea y anota la cantidad."], "resumen": "Escribes el peso o la cantidad de cada línea en el móvil. Al terminar, el albarán se crea solo, sin copiar nada."}, {"id": "carga", "icono": "🚚", "grupo": "Día a día", "titulo": "Hoja de carga", "roles": "t", "ir": "carga", "antes": "Una hoja en papel con lo que había que cargar; se iban apuntando a mano los pesos y lo que faltaba.", "ahora": "La hoja de carga se genera sola con los pedidos del día. Se marca lo que se va cargando y se puede imprimir igualmente.", "pasos": ["Entra en «Carga» y elige el día.", "«Por cliente»: cada cliente con sus líneas. Marca cada línea cuando esté cargada.", "«Totales»: cuánto hay que cargar de cada producto en total (lo pedido menos el sobrante del día anterior).", "«Sobrante»: lo que sobra al volver (ver el apartado de sobrante).", "«Imprimir hoja de carga (A4)»: sale con huecos para apuntar a mano el peso real y «falta: ______» si lo prefieres en papel.", "Desde aquí puedes ir a la hoja de compra y a «A quién hemos comprado».", "Si te das cuenta tarde de un error: pulsa ✏️ junto a la línea para cambiar la cantidad pedida o la preparada, o «No ha llegado / quitar producto»."], "resumen": "La hoja de carga se genera sola con los pedidos del día. Se marca lo que se va cargando y se puede imprimir igualmente."}, {"id": "sobrante", "icono": "♻️", "grupo": "Día a día", "titulo": "Anotar el sobrante", "roles": "t", "ir": "carga", "antes": "Al volver se apuntaba lo que sobraba y luego había que acordarse al día siguiente.", "ahora": "Lo que sobra se anota en la app y al día siguiente se resta solo de lo que hay que cargar y comprar.", "pasos": ["Entra en «Carga» → pestaña «Sobrante».", "Pulsa «+ Añadir sobrante», elige el producto, la cantidad y quién lo lleva.", "Al día siguiente, en «Totales» y en la hoja de compra, verás el sobrante ya restado."], "resumen": "Lo que sobra se anota en la app y al día siguiente se resta solo de lo que hay que cargar y comprar."}, {"id": "entregar", "icono": "✅", "grupo": "Día a día", "titulo": "Entregar y cobrar", "roles": "t", "ir": "entregas", "antes": "Cada repartidor se llevaba los albaranes de sus clientes y cobraba o dejaba la copia para firmar.", "ahora": "La app dice qué entregas tienes y a quién. Marcas cómo se ha entregado (en mano, en la puerta o en el almacén con llave) y apuntas el cobro desde el móvil. El albarán queda cargado en la página privada del cliente aunque no haya nadie para firmar.", "pasos": ["Entra en «Entregas» y busca el pedido del cliente.", "Si el cliente paga al momento, se le da la copia BLANCA. La ROSA vuelve a la oficina.", "Si NO paga al momento, en vez de la blanca se le da la copia AMARILLA y el cliente la firma. La amarilla también vuelve a la oficina.", "Pulsa «Entregado» y elige CÓMO se ha entregado: 🤝 en mano, 🚪 dejado en la puerta o 🔑 metido en el almacén con llave. Queda anotado.", "Al marcar la entrega, el albarán se carga solo en el portal del cliente (su página privada). Si no había nadie ni firma, el cliente ve igualmente que está entregado y cómo.", "Si cobras, apunta el cobro.", "Antes de entregar puedes mirar «Deudas» por si ese cliente debe algo."], "resumen": "La app dice qué entregas tienes y a quién. Marcas cómo se ha entregado (en mano, en la puerta o en el almacén con llave) y apuntas el cobro desde el móvil. El albarán queda cargado en la página privada del cliente aunque no haya nadie para firmar."}, {"id": "venta_ruta", "icono": "➕", "grupo": "Día a día", "titulo": "Venta en ruta (algo que no estaba en el pedido)", "roles": "t", "ir": "lista", "antes": "Si el cliente pedía algo en el momento (por ejemplo, una caja de limones) se dejaba y luego había que acordarse de añadirlo al albarán.", "ahora": "Lo añades al pedido del cliente en el momento y el albarán se actualiza. No hace falta rehacer nada.", "pasos": ["Abre el pedido de ese cliente (en «Preparar» o «Lista de pedidos»). Tiene que estar terminado.", "Pulsa «➕ Venta en ruta».", "Busca el producto, escribe cantidad y unidad. El precio sale de la tarifa del cliente; cámbialo si hace falta.", "Pulsa «Añadir al pedido y al albarán». La app avisa de que, si el albarán ya estaba en una factura de Golden, hay que corregirla allí.", "El albarán conserva su número y su importe se actualiza. La oficina asignará el lote en «Confirmar trazabilidad»."], "resumen": "Lo añades al pedido del cliente en el momento y el albarán se actualiza. No hace falta rehacer nada."}, {"id": "editar_pedido", "icono": "✏️", "grupo": "Día a día", "titulo": "Editar un pedido antes o durante la preparación", "roles": "t", "ir": "lista", "antes": "Si el cliente cambiaba algo o el pedido entraba con un fallo, había que anularlo y hacerlo de nuevo.", "ahora": "Cualquier persona del equipo puede corregir un pedido que aún no está terminado: cliente, fecha, productos, cantidades y precios. Queda anotado en el registro de cambios.", "pasos": ["Abre el pedido (en «Preparar» o «Lista de pedidos»).", "Pulsa «✏️ Editar pedido».", "Cambia el cliente, la fecha, las notas o las líneas (añadir, quitar, cantidad, unidad, precio).", "Pulsa «Guardar». Si el pedido ya está terminado, usa «Venta en ruta» para añadir algo."], "resumen": "Editar pedido: lo pueden hacer todos los roles mientras no esté terminado."}, {"id": "pegar_voz", "icono": "📋", "grupo": "Día a día", "titulo": "Pegar, dictar o capturar un pedido (más fácil que nunca)", "roles": "o", "ir": "importar", "antes": "Había que copiar a mano lo que llegaba por WhatsApp.", "ahora": "Pegas el mensaje tal cual, lo dictas o subes una captura. La app reconoce clientes y productos, recuerda los nombres que le corriges, y entiende precios sueltos como «patatas 0,62» sin confundirlos con un producto.", "pasos": ["Copia el mensaje en WhatsApp (mantén pulsado › Copiar).", "En la app entra en «Apuntar pedido», pulsa «📋 Pegar WhatsApp» y luego el botón grande «📋 Pegar lo copiado».", "Para dictar usa «🎤 Dictar pedido»; para una captura, «📷 Escanear pedido».", "Revisa lo rojo: toca el producto o cliente y elige el correcto. La próxima vez lo recordará.", "También puedes compartir un texto desde WhatsApp hacia la app instalada.", "Al dictar entiende «kilo y medio», «medio kilo», «dos kilos y medio» o «dos con cinco» (2,5), y corrige palabras mal oídas que se parecen a tus productos y clientes. Di «siguiente» entre productos. Revisa siempre el texto antes de confirmar."], "resumen": "Pegar, dictar o capturar: la app reconoce y aprende. Precios sueltos tipo «patatas 0,62» se entienden."}, {"id": "docenas", "icono": "🥚", "grupo": "Día a día", "titulo": "Huevos y otros productos por docenas", "roles": "t", "ir": "catalogo", "antes": "Los huevos se apuntaban en kilos o en unidades aunque se venden por docenas.", "ahora": "Cada línea del pedido tiene su propia unidad, y «docena» es una de ellas. Puedes pedir, preparar y cobrar los huevos por docenas aunque el resto de productos vaya por kilo.", "pasos": ["Una sola vez (oficina): Productos › Huevos › «Se vende en docena» y «Precio por docena».", "Al hacer o editar un pedido, elige la unidad «docena» en la línea (o escribe «3 docenas de huevos» al pegar el pedido).", "Al preparar, anota las docenas reales. En el albarán sale «docenas» y el precio por docena.", "Si un cliente pide huevos «por unidades», cambia la unidad de esa línea a «pieza»."], "resumen": "Docenas: se elige «docena» como unidad de la línea; el precio es por docena."}, {"id": "ruta", "icono": "🗺️", "grupo": "Día a día", "titulo": "Ruta de reparto", "roles": "t", "ir": "ruta", "antes": "El orden de las paradas dependía de la memoria de cada repartidor.", "ahora": "La app propone el orden de las paradas según dónde está cada cliente y su horario.", "pasos": ["Entra en «Ruta», elige el día y la hora de salida (por defecto, Mercamadrid).", "Verás las paradas en orden, con la hora estimada de llegada.", "Para que funcione bien, cada cliente necesita su ubicación y su horario en la ficha (Clientes → Datos)."], "resumen": "La app propone el orden de las paradas según dónde está cada cliente y su horario."}, {"id": "reparto_pincel", "icono": "🖌️", "grupo": "Día a día", "titulo": "Repartir los pedidos entre repartidores (modo pincel)", "roles": "t", "ir": "reparto", "antes": "Se decía de palabra quién llevaba cada cliente y había líos.", "ahora": "En «Reparto» eliges quién reparte (cada uno tiene su color) y vas tocando los clientes: se asignan al instante. Después cada albarán sabe qué repartidor lo ha llevado.", "pasos": ["Entra en «Reparto» y elige el día.", "Elige quiénes reparten hoy (cada uno con su color).", "Elige a quién vas a asignar y toca los clientes: se asignan al momento. Para soltar uno, tócalo de nuevo.", "Los repartidores también pueden coger aquí sus propios clientes.", "Con «Ruta» ordenas las paradas de cada uno.", "El nombre del repartidor sale en cada albarán y en «Albaranes → Por repartidor» para cuadrar la caja."], "resumen": "En «Reparto» eliges quién reparte (cada uno tiene su color) y vas tocando los clientes: se asignan al instante. Después cada albarán sabe qué repartidor lo ha llevado."}, {"id": "albaranes", "icono": "🧾", "grupo": "Papeles e impresión", "titulo": "Albaranes y sus tres copias", "roles": "t", "ir": "albaranes", "antes": "Los albaranes se hacían a mano en papel, en tres copias de colores, y había que numerarlos y copiar los datos.", "ahora": "El albarán sale solo al terminar el pedido, con número, cliente, productos, pesos e importe. Se imprimen las tres copias de una vez.", "pasos": ["Entra en «Albaranes». Elige el periodo y busca por cliente, número o repartidor. El botón de orden cambia entre más nuevos primero y más antiguos primero.", "Cada albarán muestra qué repartidor lo ha llevado, si está firmado, si tiene incidencias y si ya está en el portal del cliente. Los anulados también salen.", "Toca un albarán para abrirlo, imprimirlo o enviarlo sin papel (mira «Enviar el albarán sin imprimir»).", "Salen tres copias: BLANCA (para el cliente si paga al momento), ROSA (oficina) y AMARILLA (oficina; si el cliente no paga al momento se le da esta en lugar de la blanca y la firma).", "Cada copia lleva escrito su nombre, así que se distinguen aunque la impresora no tenga color.", "Un albarán equivocado no se borra: la oficina lo anula con un motivo. Si solo falta algo, se usa «Venta en ruta».", "Elige el tamaño: papel A4 o ticket de 80 mm."], "resumen": "El albarán sale solo al terminar el pedido, con número, cliente, productos, pesos e importe. Se imprimen las tres copias de una vez."}, {"id": "albaran_enlace", "icono": "📲", "grupo": "Papeles e impresión", "titulo": "Enviar el albarán sin imprimir (enlace, WhatsApp, QR)", "roles": "t", "ir": "albaranes", "antes": "El cliente se quedaba con el papel, o no había nadie para recibirlo; si pagaba otra persona había que reenviarlo.", "ahora": "Desde el albarán pulsas «📲 Enviar albarán sin imprimir»: se manda un enlace por WhatsApp o correo, o se enseña un QR. El enlace se abre en cualquier móvil sin instalar nada, se queda guardado en el chat y se descarga en PDF. Imprimir sigue disponible.", "pasos": ["Abre el albarán (tiene que estar cerrado) y pulsa «📲 Enviar albarán sin imprimir».", "Escribe el nombre y el móvil o correo de quien lo recibe (cocinero, camarero, jefe, gestoría…). Los usados antes con ese cliente salen como botones para repetir con un toque.", "Elige WhatsApp, correo, compartir en otra app, QR en pantalla o «Copiar solo el enlace». El enlace sale siempre escrito debajo del QR por si la cámara no lo lee.", "Cada envío queda anotado (a quién y cuándo).", "Ese enlace enseña SOLO ese albarán, con productos, pesos, precios, total, y la firma si la hay.", "Si no hay conexión, usa «📄 Enviar el PDF adjunto» o imprímelo.", "Requiere haber ejecutado en Supabase el archivo «Parte 57»."], "resumen": "Desde el albarán pulsas «📲 Enviar albarán sin imprimir»: se manda un enlace por WhatsApp o correo, o se enseña un QR. El enlace se abre en cualquier móvil sin instalar nada, se queda guardado en el chat y se descarga en PDF. Imprimir sigue disponible."}, {"id": "portal", "icono": "🌐", "grupo": "Papeles e impresión", "titulo": "Portal de clientes: la página privada de cada cliente", "roles": "t", "ir": "paginasclientes", "antes": "Cada albarán había que mandarlo o imprimirlo, y la secretaria del cliente tenía que pedirlos para hacer las facturas.", "ahora": "Cada cliente tiene su portal: una página privada, solo suya, donde aparecen solos todos sus albaranes de cada día, con el total del mes, el PDF de cada albarán y un resumen del mes en PDF y Excel (CSV). Se guarda una vez en favoritos o con un QR y no hay que reenviar nada. Ningún cliente ve los albaranes de otro.", "pasos": ["Entra por el botón azul 🌐 de arriba (en cualquier pantalla) o por la franja «Portal de clientes» del Inicio, que muestra cuántos albaranes faltan por cargar.", "Arriba salen los albaranes por cargar: «Cargar todos en el portal» o uno a uno. Se cargan solos al marcar la entrega, así que normalmente no falta ninguno.", "Debajo está el buscador de clientes. Por cada cliente: «📱 QR y enlace» (enseñas el QR o copias el enlace y lo mandas una sola vez), «🔗 Copiar», «👁 Ver como cliente» y «🔒 Anular».", "«Anular» (solo la oficina) crea un enlace nuevo y el anterior deja de funcionar (si lo ha perdido o no debe tenerlo).", "El cliente elige el mes, ve cada albarán, lo descarga en PDF y baja el resumen del mes (PDF o Excel) para facturar en Visual Factu o Golden Soft.", "Cuando se deja sin nadie (puerta o almacén con llave) el cliente ve igualmente que está entregado y cómo.", "«Quitar del portal» en un albarán lo oculta de su página. Requiere haber ejecutado el archivo «Parte 57»."], "resumen": "Cada cliente tiene su portal: una página privada, solo suya, donde aparecen solos todos sus albaranes de cada día, con el total del mes, el PDF de cada albarán y un resumen del mes en PDF y Excel (CSV). Se guarda una vez en favoritos o con un QR y no hay que reenviar nada. Ningún cliente ve los albaranes de otro."}, {"id": "bluetooth", "icono": "🖨️", "grupo": "Papeles e impresión", "titulo": "Imprimir con la impresora térmica Bluetooth (de cualquier marca)", "roles": "t", "ir": null, "antes": "Los albaranes se escribían a mano; las hojas de carga y compra, también.", "ahora": "Se imprime desde el móvil, en la furgoneta o en el almacén, con una impresora térmica Bluetooth pequeña. La app prepara un PDF al ancho de tu rollo y lo mandas a la app de tu impresora, sea la marca que sea. Imprimir sigue siendo opcional: el cliente puede recibir el albarán sin papel.", "pasos": ["Una sola vez: empareja la impresora con el móvil en Ajustes → Bluetooth e instala la aplicación de tu impresora (cada marca tiene la suya).", "Hoja de carga u hoja de compra: pulsa «🧾 Impresora térmica». Elige el ancho del rollo (58 mm, 80 mm o 100 mm) y qué quieres imprimir.", "Pulsa «Enviar a la app de la impresora» y elige esa aplicación. Si no la ves, usa «Descargar» y ábrelo desde la app de la impresora.", "Si hay pocas líneas sale en una sola tira. Si hay muchas, se parte en hojas numeradas «Hoja 1 de N».", "Cada archivo se guarda con un número distinto (FJ-0001, FJ-0002…) para encontrarlo fácil.", "Albaranes: abre el albarán y pulsa imprimir; para ticket elige «Ticket 80 mm».", "Sin impresora a mano: guarda como PDF y envíalo por WhatsApp, o envía el albarán por enlace."], "resumen": "Se imprime desde el móvil, en la furgoneta o en el almacén, con una impresora térmica Bluetooth pequeña. La app prepara un PDF al ancho de tu rollo y lo mandas a la app de tu impresora, sea la marca que sea. Imprimir sigue siendo opcional: el cliente puede recibir el albarán sin papel."}, {"id": "hojacarga_imp", "icono": "📄", "grupo": "Papeles e impresión", "titulo": "Hoja de carga y hoja de compra impresas", "roles": "t", "ir": "hojacompra", "antes": "Se hacía una hoja de compra para todos los pedidos del día, parecida a la de carga, y se apuntaba todo a mano.", "ahora": "Las dos hojas las genera la app. Se imprimen y, si hace falta, se anota a mano sobre el papel, como siempre.", "pasos": ["Atajo en el Inicio: «🖨 Imprimir ahora» → Hoy o Mañana → «Hoja de carga» u «Hoja de compra».", "«Hoja de compra»: elige el día en el calendario (los pedidos suelen llegar días antes). Verás cada producto con lo pedido, el sobrante restado y lo que hay que comprar.", "Pulsa «Imprimir hoja de compra (A4)»: lleva una casilla por producto y huecos para el proveedor y lo comprado.", "«Hoja de carga» → «Imprimir hoja de carga (A4)»: lleva el peso y un hueco «falta» por línea.", "Para la impresora térmica pulsa «🧾 Impresora térmica» (mira «Imprimir con la impresora térmica»).", "Las dos se pueden imprimir en papel, guardar en PDF o mandar por WhatsApp."], "resumen": "Las dos hojas las genera la app. Se imprimen y, si hace falta, se anota a mano sobre el papel, como siempre."}, {"id": "compra", "icono": "🧺", "grupo": "Compras y facturas", "titulo": "Qué comprar en Mercamadrid", "roles": "t", "ir": "hojacompra", "antes": "Alguien sumaba todos los pedidos a mano para saber cuánto comprar.", "ahora": "La app suma los pedidos del día y resta lo que sobró. Esa es tu lista de la compra.", "pasos": ["Entra en «Hoja de compra» y elige la fecha.", "Cada producto muestra: cuánto está pedido, cuánto sobra y cuánto hay que comprar.", "Imprímela o mírala en el móvil mientras compras.", "El personal de compras tiene también «Compras» → «Qué comprar», con más detalle."], "resumen": "La app suma los pedidos del día y resta lo que sobró. Esa es tu lista de la compra."}, {"id": "quien", "icono": "🛒", "grupo": "Compras y facturas", "titulo": "A quién hemos comprado hoy", "roles": "t", "ir": "quien", "antes": "El proveedor de cada cosa estaba en la cabeza de quien compraba o en la factura, que luego había que buscar.", "ahora": "Al comprar, cualquiera anota el nombre del puesto de Mercamadrid donde compró cada producto. Con eso se hace la trazabilidad y las facturas.", "pasos": ["Entra en «A quién compramos hoy».", "Para cada producto, escribe o elige el proveedor. No hace falta saber qué es un lote.", "Se puede dejar en blanco: no da error y los albaranes se pueden hacer igualmente. La oficina lo completará después.", "Esto es lo que luego permite saber de dónde salió cada producto si hay que responder a una inspección o a una reclamación."], "resumen": "Al comprar, cualquiera anota el nombre del puesto de Mercamadrid donde compró cada producto. Con eso se hace la trazabilidad y las facturas."}, {"id": "compras_reg", "icono": "🛍️", "grupo": "Compras y facturas", "titulo": "Registrar compras, lotes y precios de compra", "roles": "c", "ir": "compras", "antes": "Los albaranes y facturas de proveedores se guardaban en papel o en el correo, y para saber a cuánto salía un producto había que buscar.", "ahora": "Cada compra queda registrada con su proveedor, su lote y su precio. Se ve la evolución del precio de compra.", "pasos": ["Entra en «Compras» → «Registrar compra». Elige proveedor, fecha y productos con cantidades y precios.", "«Lotes»: cada producto comprado queda como lote. Es la base de la trazabilidad.", "«Sin factura»: compras todavía sin su factura. Se adjunta el archivo cuando llegue.", "«Precios de compra» (en Inicio) muestra cómo cambian por día y por producto."], "resumen": "Cada compra queda registrada con su proveedor, su lote y su precio. Se ve la evolución del precio de compra."}, {"id": "frecibidas", "icono": "📬", "grupo": "Compras y facturas", "titulo": "Facturas de proveedores que llegan por correo", "roles": "c", "ir": "compras", "antes": "Los proveedores mandaban las facturas por correo (Hotmail) y alguien las abría, las imprimía o las guardaba y las buscaba cuando hacían falta.", "ahora": "Todas las facturas con archivo adjunto que llegan por correo se cargan solas en la app. Nadie tiene que abrirlas ni guardarlas.", "pasos": ["Los correos de los proveedores con factura se reenvían a la cuenta de facturas de Ferjusanz (una regla en el correo, que se hace una sola vez).", "Cada 10 minutos la app revisa esa cuenta y sube a «Compras» → «Recibidas» todo lo que lleve un archivo adjunto.", "Tú solo entras en «Recibidas» y enlazas cada factura con su compra o proveedor con un toque.", "Si no es una factura, pulsa «Descartar».", "Las facturas no se pierden ni se repiten: si llega dos veces la misma, solo se guarda una.", "Los correos originales siguen en el correo de siempre; el reenvío es solo una copia."], "resumen": "Todas las facturas con archivo adjunto que llegan por correo se cargan solas en la app. Nadie tiene que abrirlas ni guardarlas."}, {"id": "lector_facturas", "icono": "🧾", "grupo": "Compras y facturas", "titulo": "Lector de facturas de proveedores", "roles": "c", "ir": "compras", "antes": "Las facturas de proveedor se miraban a mano para saber qué costó cada cosa.", "ahora": "Subes la factura (PDF o foto): la app lee productos, cantidades y precios, recuerda qué artículo es cada producto para ese proveedor y guarda el precio de compra.", "pasos": ["Entra en «Facturas de proveedores» y abre la factura recibida.", "Pulsa leer factura y revisa líneas y precios.", "Si un artículo no se reconoce, elige el producto una vez: queda recordado para ese proveedor.", "La app comprueba si la suma de las líneas leídas cuadra con la base imponible de la factura y avisa si no (⚠ NO cuadra). Si una línea no trae precio, lo calcula y lo marca para revisarlo.", "Guarda: el precio de compra pasa a la casilla de coste y a la ganancia.", "Si la factura aún no ha llegado, no pasa nada: pon los precios de venta igualmente.", "Entiende descuentos (%), descripciones partidas en dos filas y números mal leídos en fotos. Las filas que no entiende te las avisa para que las añadas a mano."], "resumen": "Lector de facturas: lee, recuerda artículos y guarda precios de compra."}, {"id": "traza", "icono": "🔎", "grupo": "Compras y facturas", "titulo": "Trazabilidad: de dónde sale cada producto", "roles": "o", "ir": "traza", "antes": "Para saber a quién se había entregado un producto comprado en un puesto concreto había que revisar papeles.", "ahora": "La app propone de qué compra sale cada línea entregada. La oficina revisa y confirma. Si hay que investigar un lote, se ve a qué clientes llegó.", "pasos": ["Entra en «Trazabilidad» → «Confirmar trazabilidad».", "La app propone el lote de cada línea (el más antiguo primero). En naranja están las que tienen varios lotes posibles: revísalas.", "Confirma pedido a pedido. Si falta información, puedes dejarlo «sin trazabilidad» indicando el motivo.", "Las ventas en ruta aparecen aquí pendientes de asignar lote.", "Para buscar: «Por lote», «Por cliente» o «Para factura»."], "resumen": "La app propone de qué compra sale cada línea entregada. La oficina revisa y confirma. Si hay que investigar un lote, se ve a qué clientes llegó."}, {"id": "cobros", "icono": "💶", "grupo": "Dinero", "titulo": "Cobros, caja y deudas", "roles": "t", "ir": "cobros", "antes": "Los cobros se apuntaban en papel y las deudas se llevaban de memoria o en cuadernos.", "ahora": "Cada cobro se apunta en el momento. La app sabe qué falta por cobrar de cada albarán y de cada cliente.", "pasos": ["«Cobros» → «Pendientes de cobro»: los albaranes que aún no están cobrados. Filtra por vencidos, contado o crédito.", "Para cobrar: abre el albarán y apunta el importe y la forma de pago. Se pueden hacer cobros parciales.", "«Caja del día» (oficina): lo cobrado en el día.", "«Deudas»: por albarán o por cliente, y lo que se debe a proveedores (solo compras y oficina). Todos pueden ver quién debe."], "resumen": "Cada cobro se apunta en el momento. La app sabe qué falta por cobrar de cada albarán y de cada cliente."}, {"id": "precios_pend", "icono": "💶", "grupo": "Dinero", "titulo": "Poner precios a los pedidos (pantalla aparte)", "roles": "t", "ir": "preciosp", "antes": "No se podía cerrar el albarán sin tener todos los precios, y a veces la factura del proveedor aún no ha llegado.", "ahora": "Hay una pantalla propia, «Precios» (abajo en el menú y el botón verde grande del Inicio): lista los pedidos por hacer, en preparación y terminados y te deja poner o cambiar los precios de cada uno. Cerrar el albarán no depende de ellos, y no hace falta la factura del proveedor.", "pasos": ["Toca «Precios» abajo (o el botón verde «Poner precios a los pedidos» del Inicio).", "Elige el día (Hoy, Ayer, Mañana, Últimos días) y, si quieres, el estado (Por hacer, En preparación, Terminados).", "Por defecto solo salen los pedidos con precios por poner; quita la marca para verlos todos.", "Toca el pedido y escribe los precios (kg o unidad). Con «Intro» saltas al siguiente. Usa «Rellenar con las tarifas del cliente» para ir más rápido y guarda.", "En el albarán, «Falta algo: peso, precio o compra» y los avisos «sin precio» / «sin peso» son botones: te llevan directamente a lo que falta.", "Si tienes que poner el MISMO producto en muchos pedidos, usa «⚡ Poner precios por PRODUCTO» (mira esa guía).", "Todos los roles pueden hacerlo y queda anotado en el registro de cambios."], "resumen": "Pantalla «Precios»: poner precios a pedidos por hacer, en preparación o terminados, sin esperar a la factura."}, {"id": "precios_producto", "icono": "⚡", "grupo": "Dinero", "titulo": "Poner precios por PRODUCTO (todos los clientes de golpe)", "roles": "t", "ir": "preciosdia", "antes": "Había que abrir pedido por pedido para poner el mismo producto a cada cliente, y no se veía bien cuánto se había cobrado la última vez.", "ahora": "Una pantalla agrupa cada producto con todos los clientes que lo piden ese día. Pones los precios de seguido, con el último precio de cada cliente al lado y a cada precio puedes elegir kg o unidad (por ejemplo, aguacate por caja).", "pasos": ["En el Inicio o en «Precios» pulsa «⚡ Poner precios por PRODUCTO». Elige el día.", "Cada producto sale con los clientes que lo piden. Escribe el precio de cada uno; «Intro» salta al siguiente.", "«A todos» pone el mismo precio a todos los clientes de ese producto (te pregunta antes de cambiar precios que ya estaban).", "Elige /kg o /unidad en cada fila: sirve para productos que se venden por caja entera, como el aguacate.", "Los totales se ven siempre en pantalla para comprobar el importe.", "Se guarda como cualquier otro precio y queda anotado en el registro de cambios."], "resumen": "Una pantalla agrupa cada producto con todos los clientes que lo piden ese día. Pones los precios de seguido, con el último precio de cada cliente al lado y a cada precio puedes elegir kg o unidad (por ejemplo, aguacate por caja)."}, {"id": "ganancia", "icono": "💹", "grupo": "Dinero", "titulo": "Cuánto ganamos: casilla de coste y ganancia del pedido", "roles": "c", "ir": "preciosp", "antes": "No se veía el margen hasta mirar las facturas a mano.", "ahora": "Al lado de cada precio de venta ves el último precio de compra y cuánto ganas por kilo. Cada pedido y albarán tiene una tarjeta «💹 Ganancia del pedido» que solo ve el equipo (nunca sale en el albarán del cliente).", "pasos": ["Al poner un precio ves «💶 Compra: X €/kg» y «Ganas +Y €/kg (Z %)». En rojo si estás por debajo del coste.", "Abre un pedido o albarán y despliega «💹 Ganancia del pedido»: vendes, compras y ganas por línea y en total.", "Si no hay coste o está en otra unidad, la línea sale como «sin coste»: no bloquea nada.", "En Comercial › Calculadora pones un % o un precio y ves lo que ganas por producto."], "resumen": "Ganancia: precio de compra al lado del de venta, tarjeta por pedido y calculadora. Solo equipo, no en el albarán del cliente."}, {"id": "fclientes", "icono": "📄", "grupo": "Dinero", "titulo": "Facturas de clientes", "roles": "o", "ir": "facturascli", "antes": "Las facturas se hacen en Golden y no había forma rápida de ver las de un cliente.", "ahora": "Golden sigue haciendo la factura. En la app se apunta cada una (número, fecha, importe) para consultarla por cliente y saber si está cobrada.", "pasos": ["Entra en «Facturas de clientes» y pulsa «+ Añadir factura»: cliente, número, fecha e importe. Puedes adjuntar el PDF o una foto.", "Filtra por «Pendientes de cobro» o «Cobradas». Al tocar una factura puedes marcarla cobrada, ver el archivo o quitarla de la lista.", "En «Clientes», el botón «▾ Facturas» de cada cliente despliega sus facturas. También hay una pestaña «Facturas» dentro de su ficha."], "resumen": "Golden sigue haciendo la factura. En la app se apunta cada una (número, fecha, importe) para consultarla por cliente y saber si está cobrada."}, {"id": "golden", "icono": "🗂️", "grupo": "Dinero", "titulo": "Histórico de Golden (facturas ya hechas)", "roles": "o", "ir": "golden", "antes": "Para ver una factura antigua había que abrir Golden en el ordenador de la oficina y buscarla.", "ahora": "Todas las facturas de 2026 que ya están en Golden se pueden consultar desde la app, en el móvil, por cliente, por número o por producto.", "pasos": ["Entra en «Histórico de Golden» (en Inicio, dentro de «Clientes y productos»).", "«Facturas»: lista de todas, con buscador por cliente o por número. Toca una para ver todos sus productos, cantidades, precios e IVA.", "«Por cliente»: cuánto se ha facturado a cada cliente en 2026. Toca uno para ver sus facturas.", "«Por producto»: escribe un producto (por ejemplo, tomate pera) y verás cuánto se ha vendido y cuánto dinero ha supuesto.", "Puedes filtrar por mes. Los borradores de Golden no se cuentan salvo que marques «Con borradores».", "En la ficha de cada cliente, pestaña «Facturas», aparece también su historial de Golden.", "Es solo consulta: aquí no se puede cambiar nada. La factura se sigue haciendo en Golden."], "resumen": "Todas las facturas de 2026 que ya están en Golden se pueden consultar desde la app, en el móvil, por cliente, por número o por producto."}, {"id": "resumen", "icono": "📊", "grupo": "Dinero", "titulo": "Resumen del día y rentabilidad", "roles": "o", "ir": "resumen", "antes": "Para saber cómo había ido el día o qué productos dejaban más margen había que hacer cuentas.", "ahora": "El resumen del día y la rentabilidad se calculan solos con los pedidos, los cobros y las compras.", "pasos": ["«Resumen del día»: pedidos, entregas, importes y cobros del día.", "«Rentabilidad»: elige un periodo y mira el margen por producto o por cliente (necesita que las compras estén registradas).", "Los preparadores no ven estas pantallas."], "resumen": "El resumen del día y la rentabilidad se calculan solos con los pedidos, los cobros y las compras."}, {"id": "clientes", "icono": "👥", "grupo": "Clientes y productos", "titulo": "Clientes y productos", "roles": "t", "ir": "clientes", "antes": "Los datos de clientes y precios estaban en Golden o en papel.", "ahora": "Cada cliente tiene su ficha con teléfono, dirección, horario, forma de pago, precios propios y pedidos anteriores.", "pasos": ["«Clientes»: busca por nombre, código, NIF o teléfono. Toca uno para ver y editar su ficha (oficina).", "En la ficha: Datos, Precios, Últimos pedidos, Habituales, Facturas e Incidencias.", "«Productos»: el catálogo con sus unidades de venta (kg, caja, saco, docena…). Un producto inactivo no se ofrece en los pedidos.", "«Formatos y abreviaturas»: aquí la app aprende cuánto pesa una caja o un saco de cada cliente, y qué significa cada abreviatura que usan al pedir."], "resumen": "Cada cliente tiene su ficha con teléfono, dirección, horario, forma de pago, precios propios y pedidos anteriores."}, {"id": "equipo", "icono": "💬", "grupo": "Equipo y avisos", "titulo": "Chat, avisos, incidencias y buscador", "roles": "t", "ir": "chat", "antes": "Los avisos eran llamadas y mensajes sueltos de WhatsApp.", "ahora": "Todo lo del trabajo en un solo sitio, ligado a cada pedido o cliente.", "pasos": ["💬 (arriba) abre el chat del equipo. El número rojo son mensajes sin leer.", "«Avisos y ofertas»: para avisar a todos de algo importante, o apuntar una oferta para clientes.", "«Incidencias»: apunta cualquier problema (producto en mal estado, cliente que reclama…) y quedan ligadas al cliente o al producto.", "🔍 (arriba) busca clientes, productos, proveedores o números de albarán en toda la app."], "resumen": "Todo lo del trabajo en un solo sitio, ligado a cada pedido o cliente."}, {"id": "fichajes", "icono": "⏱️", "grupo": "Equipo y avisos", "titulo": "Fichar entrada y salida", "roles": "t", "ir": "perfil", "antes": "Las horas de entrada y salida se apuntaban a mano o de memoria, y a final de mes había que reconstruirlas.", "ahora": "Cada uno ficha desde su móvil con un solo botón, con la hora exacta. A final de mes la oficina descarga las horas de todos.", "pasos": ["Al llegar al trabajo: entra en «Mi perfil» y pulsa el botón grande «Fichar ENTRADA».", "Al terminar: vuelve a «Mi perfil» y pulsa «Fichar SALIDA» (el mismo botón cambia de color).", "Ficha SIEMPRE desde tu móvil y en tu usuario: cada persona ficha a su nombre.", "Si no hay cobertura, se guarda la hora real y se envía sola cuando vuelva la conexión. En la lista aparece marcado como «sin conexión».", "Si te olvidas de fichar, díselo a la oficina para que lo corrija: no lo apuntes tú dos veces.", "Oficina: en «Fichajes» eliges el mes, ves las horas de cada persona y puedes descargar el listado para la gestoría."], "resumen": "Cada uno ficha desde su móvil con un solo botón, con la hora exacta. A final de mes la oficina descarga las horas de todos."}, {"id": "com_listas", "icono": "📄", "grupo": "Comercial", "titulo": "Listas de precios en PDF (hostelería, colectivos, nuevos)", "roles": "o", "ir": "comercial", "antes": "Las tarifas se hacían a mano en otro programa y con un diseño distinto cada vez.", "ahora": "En Comercial creas listas (hostelería, colectivos, clientes nuevos, ofertas) y las descargas en PDF con diseño de Ferjusanz, listas para enviar por WhatsApp o correo.", "pasos": ["Inicio › 🤝 Comercial › 📄 Listas.", "Primera vez: pulsa «📥 Cargar las listas de colectividades y hostelería». Crea las dos listas con tus productos, sin precio de venta, y con el último precio de compra al lado (solo lo ve la oficina).", "Pulsa «➕ Nueva lista» o «✏️ Editar» en una existente.", "Busca productos para añadirlos: el precio sale de la tarifa general; puedes cambiarlo, subir/bajar todos un %, o «Rellenar con coste + %».", "Guarda y pulsa «📄 Descargar PDF» o «📲 Enviar». El PDF nunca lleva el precio de compra.", "Estas listas no cambian los precios de los clientes actuales.", "«👁️ Ver / imprimir» muestra la lista en pantalla y la imprime directamente (también «🖨️ Imprimir solo recomendaciones»)."], "resumen": "Listas de precios con buen diseño, en PDF, desde Comercial."}, {"id": "lista_cliente", "icono": "👤", "grupo": "Comercial", "titulo": "Lista de precios de un cliente (ej. Restaurante Duarte)", "roles": "o", "ir": "comercial", "antes": "Las listas de precios eran generales. Para un cliente concreto había que montarla a mano, producto a producto.", "ahora": "Pegas la lista que te pasa el cliente (un producto por línea, con el precio al final). La app reconoce los productos, la ordena de la A a la Z y le añade productos de tus otras listas sin precio, con tu precio de compra al lado, para que se lo pongas tú.", "pasos": ["Entra en Comercial › Listas y pulsa «👤 Nueva lista para un cliente».", "Busca al cliente (opcional) y pega su lista. Acepta formatos como «Patatas: 0,58», «Cebolla a 0,58», «Melón 2.00€k» o «Tomate pera 2.20».", "Si quieres ver cómo queda, pulsa «Poner la lista de Duarte (ejemplo)».", "Marca «Añadir productos de las otras listas» para que salgan también los demás productos sin precio. El precio de compra solo lo ves tú y nunca sale en el PDF.", "Pulsa «Siguiente»: revisa cada producto (✅ reconocido, ⚠️ sin vincular) y corrige el producto o el precio si hace falta.", "Pulsa «Crear lista ordenada A-Z». Se abre la lista para poner los precios que faltan viendo el de compra. Los productos sin precio no salen en el PDF.", "Opcional: marca «Guardar también como precios especiales del cliente» para que esos precios se usen en sus pedidos."], "resumen": "Comercial › Listas › 👤 Nueva lista para un cliente."}, {"id": "com_recs", "icono": "⭐", "grupo": "Comercial", "titulo": "Recomendaciones de la semana", "roles": "o", "ir": "comercial", "antes": "Se repetían a mano los productos que había que empujar cada semana.", "ahora": "Apuntas lo que recomiendas (con precio y fechas de validez). Las vigentes salen solas en las listas, y puedes enviar un PDF solo con recomendaciones.", "pasos": ["Comercial › ⭐ Recomendaciones › «➕ Nueva».", "Elige el producto (opcional), título, texto, precio y fechas.", "Cada semana pulsa «📆 Renovar una semana» o edita las que cambien.", "En Listas pulsa «⭐ Solo recomendaciones» para enviar solo eso."], "resumen": "Recomendaciones editables con fechas: aparecen solas en las listas."}, {"id": "com_avisos", "icono": "🔔", "grupo": "Comercial", "titulo": "Avisos: quejas, clientes nuevos y locales por contactar", "roles": "o", "ir": "comercial", "antes": "Se perdían las quejas sin cerrar y los contactos nuevos.", "ahora": "Comercial › Avisos te muestra los clientes con quejas sin resolver, los clientes nuevos del último mes y tu lista de contactos (restaurantes, bares, colegios, residencias) con fecha para volver a llamar.", "pasos": ["Las quejas salen de «Incidencias»: apunta cada una con su cliente.", "En «Locales nuevos» pulsa una búsqueda de Google Maps, contrasta y apunta teléfono, dirección, correo y redes con «➕ Apuntar contacto».", "Pon «Volver a llamar el»: cuando llegue la fecha sale «¡Toca llamar!».", "La app no consulta Google sola: la comprobación en Google es manual con los enlaces."], "resumen": "Avisos de comercial: quejas abiertas, clientes nuevos y contactos con seguimiento."}, {"id": "com_guion", "icono": "🗣️", "grupo": "Comercial", "titulo": "Guiones de venta, objeciones y quejas; web y SEO", "roles": "o", "ir": "comercial", "antes": "Cada llamada o queja se improvisaba.", "ahora": "Guiones listos para primera llamada, objeciones («ya tengo proveedor», «es caro») y quejas, con consejos de compostura. Además, accesos a la web y una lista de mejoras SEO.", "pasos": ["Comercial › 🗣️ Guiones: abre uno y pulsa «📋 Copiar» para usarlo en WhatsApp.", "Comercial › 🌐 Web y SEO: abrir la web, ver cómo sale en Google, velocidad y lista de mejoras.", "La web la gestiona otra persona: desde la app no se cambia su contenido."], "resumen": "Guiones y lista SEO para vender y atender quejas con calma."}, {"id": "presentaciones", "icono": "🎬", "grupo": "Comercial", "titulo": "Presentaciones para clientes (hostelería y colectividades)", "roles": "o", "ir": "presentaciones", "antes": "Cada vez se explicaba la empresa de palabra o se mandaba un PDF distinto.", "ahora": "En Comercial → 🎬 Presentaciones hay dos modelos ya preparados: Hostelería y Colectividades (colegios, residencias, escuelas infantiles). Cuentan quiénes somos, la tercera generación, Mercamadrid, las cosechas propias, cómo trabajamos, productos con imagen, ofertas y el contacto directo con un comercial. Sin precios: la lista de precios va al final y solo sale al enviarla.", "pasos": ["Inicio › 🤝 Comercial › 🎬 Presentaciones › «➕ Nueva: Hostelería» o «➕ Nueva: Colectividades».", "Cada lámina se edita con «✏️ Editar esta lámina»: títulos, textos, puntos, productos y su orden. Revisa los textos, son un borrador.", "En las láminas de productos, «📷 Foto» elige una foto de la cámara o galería. «🎨 Poner dibujos» rellena con un dibujo los que no tengan foto.", "La lámina «Ofertas» enseña las ofertas vigentes de Comercial → Recomendaciones, sin precio.", "«▶ Presentar» se pasa con el dedo a pantalla completa y no enseña precios. «📄 PDF» y «📲 Enviar» tampoco llevan la lista.", "«💶 Enviar con lista de precios» añade al final la lista de ese tipo de cliente, solo con el precio de venta: el precio de compra nunca sale.", "Requiere haber ejecutado el archivo «Parte 56»."], "resumen": "En Comercial → 🎬 Presentaciones hay dos modelos ya preparados: Hostelería y Colectividades (colegios, residencias, escuelas infantiles). Cuentan quiénes somos, la tercera generación, Mercamadrid, las cosechas propias, cómo trabajamos, productos con imagen, ofertas y el contacto directo con un comercial. Sin precios: la lista de precios va al final y solo sale al enviarla."}, {"id": "registro", "icono": "📝", "grupo": "Control", "titulo": "Registro de cambios", "roles": "o", "ir": "registro", "antes": "Si alguien cambiaba un dato en papel no quedaba rastro.", "ahora": "Todo cambio importante queda anotado: qué, quién y cuándo. Nada se pierde ni se cambia a escondidas.", "pasos": ["Entra en «Registro de cambios»: pedidos, albaranes, cobros, productos y clientes.", "Si se cambia algo de un pedido ya terminado, el cuadro de Inicio muestra un número de aviso.", "Dentro de un pedido, abajo, está el historial solo de ese pedido."], "resumen": "Todo cambio importante queda anotado: qué, quién y cuándo. Nada se pierde ni se cambia a escondidas."}, {"id": "albaranes_repartidor", "icono": "🚚", "grupo": "Control", "titulo": "Albaranes por día, cliente y repartidor (cuadrar la caja)", "roles": "o", "ir": "albaranes", "antes": "Para cuadrar el efectivo y las incidencias había que mirar los papeles de cada repartidor.", "ahora": "En «Albaranes» ves todos los albaranes por día y con buscador de cliente, estén cobrados, firmados o anulados. Cada uno indica quién lo ha entregado. La pestaña «🚚 Por repartidor» suma por cada repartidor el importe, el efectivo cobrado, lo pendiente, lo que falta por firmar y las incidencias.", "pasos": ["Entra en «Albaranes» y elige el periodo (Hoy, Ayer y hoy, 7 o 30 días).", "Busca por cliente, número o repartidor, o toca un repartidor para ver solo los suyos.", "En cada albarán: 🚚 repartidor, ✍ firmado o sin firma, ⚠ incidencias, 🌐 portal, 📦 cómo se entregó, cobrado o pendiente.", "Pestaña «🚚 Por repartidor»: importe, efectivo en mano, otros cobros, pendiente, sin firma e incidencias, y un TOTAL abajo.", "El efectivo se cuenta por quien lo cobró y el albarán por quien lo entregó (o a quien se asignó el reparto).", "Los albaranes anulados salen marcados y no suman en los totales."], "resumen": "En «Albaranes» ves todos los albaranes por día y con buscador de cliente, estén cobrados, firmados o anulados. Cada uno indica quién lo ha entregado. La pestaña «🚚 Por repartidor» suma por cada repartidor el importe, el efectivo cobrado, lo pendiente, lo que falta por firmar y las incidencias."}, {"id": "archivo", "icono": "🗄️", "grupo": "Control", "titulo": "Archivo", "roles": "o", "ir": "archivo", "antes": "Los papeles viejos se acumulaban en carpetas.", "ahora": "Los pedidos, incidencias y lotes antiguos se consultan en el archivo, sin ocupar las pantallas de cada día.", "pasos": ["Entra en «Archivo» y elige qué quieres consultar: pedidos, incidencias, lotes o facturas.", "Un pedido archivado deja de verse en las listas del día, pero no se pierde."], "resumen": "Los pedidos, incidencias y lotes antiguos se consultan en el archivo, sin ocupar las pantallas de cada día."}, {"id": "copia", "icono": "💾", "grupo": "Control", "titulo": "Copia de seguridad", "roles": "a", "ir": "copia", "antes": "Si se perdía un papel o un cuaderno, se perdía la información.", "ahora": "Un archivo con todos los datos de Ferjusanz, que se guarda en el móvil y en Drive. Si algo falla algún día, se puede recuperar.", "pasos": ["Entra en «Copia de seguridad» (solo administrador) y pulsa «💾 Descargar copia de seguridad ahora».", "Hazla una vez por semana. Si pasan más de 7 días la app lo recuerda con un «!» en el cuadro.", "Se guarda en «Descargas» del móvil. Súbela también a Google Drive o envíatela por correo, para no depender solo del móvil.", "Conserva las últimas copias, no solo la más reciente."], "resumen": "Un archivo con todos los datos de Ferjusanz, que se guarda en el móvil y en Drive. Si algo falla algún día, se puede recuperar."}, {"id": "asistente", "icono": "💬", "grupo": "Ayuda", "titulo": "El asistente: qué le puedes preguntar", "roles": "t", "ir": null, "antes": "Había que buscar en cada pantalla.", "ahora": "Escribe o dicta una pregunta y te responde con datos de la app. Entiende, entre otras: «últimas compras de remolacha», «qué pedidos faltan por poner precio», «quién se queja», «a quién tengo que llamar», «ábreme Comercial».", "pasos": ["Abre el asistente (❓ arriba).", "Pregunta con tus palabras: precios, deudas, albaranes, último registro de compra o venta de un producto.", "Para ir a una pantalla di «abre…» o «llévame a…».", "Si no entiende, prueba con el nombre del producto o del cliente tal como sale en la app.", "Las filas de los resultados se pueden tocar: te llevan a la compra, al pedido o a la factura de esa fila."], "resumen": "Asistente: consultas, últimas compras/ventas, precios pendientes, quejas, a quién llamar, y atajos a pantallas."}, {"id": "pantalla", "icono": "🌙", "grupo": "Ajustes", "titulo": "Modo oscuro y varios móviles a la vez", "roles": "t", "ir": "perfil", "antes": "La pantalla era siempre clara y cada móvil iba por su lado.", "ahora": "Puedes poner la app en modo oscuro, usarla en 2 o 3 móviles a la vez viendo los cambios de los demás al momento.", "pasos": ["Modo oscuro: pulsa el botón redondo 🌙 de abajo a la derecha (en cualquier pantalla) para pas const sin=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const tag={o:'Oficina',c:'Compras',a:'Admin'};
function txt(g){return g.icono+' *'+g.titulo+'*\n'+(g.antes?'📝 Antes: '+g.antes+'\n':'')+'📱 Ahora: '+g.ahora+'\n\n'+g.pasos.map((p,i)=>(i+1)+'. '+p).join('\n')}
function pinta(){const t=sin(document.getElementById('q').value);const l=document.getElementById('l');l.textContent='';
 let gr='';GUIA.filter(g=>!t||sin(g.titulo+' '+g.ahora+' '+(g.antes||'')+' '+g.pasos.join(' ')).includes(t)).forEach(g=>{
  if(!t&&g.grupo!==gr){gr=g.grupo;const hh=document.createElement('h2');hh.textContent=gr;hh.style.cssText='font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 0 4px';l.append(hh)}
  const d=document.createElement('details');if(t)d.open=true;
  const s=document.createElement('summary');s.textContent=g.icono+' '+g.titulo;if(tag[g.roles]){const b=document.createElement('span');b.className='tag';b.textContent=tag[g.roles];s.append(b)}
  const sm=document.createElement('small');sm.textContent=g.ahora;s.append(sm);d.append(s);
  if(g.antes){const a=document.createElement('div');a.className='antes';a.innerHTML='<b>📝 Antes</b><br>';a.append(document.createTextNode(g.antes));d.append(a)}
  const n=document.createElement('div');n.className='ahora';n.innerHTML='<b>📱 Ahora</b><br>';n.append(document.createTextNode(g.ahora));d.append(n);
  const o=document.createElement('ol');g.pasos.forEach(p=>{const li=document.createElement('li');li.textContent=p;o.append(li)});d.append(o);
  const b=document.createElement('button');b.textContent='📲 Enviar por WhatsApp';b.onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(txt(g)+'\n\nGuía completa: '+location.href.replace(/[#?].*$/,'')),'_blank');d.append(b);l.append(d)});
 if(!l.children.length)l.textContent='No hay resultados.'}
document.getElementById('q').oninput=pinta;pinta();
</script></body></html>
