<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guía de la app de Ferjusanz</title>
<style>
:root{--bg:#f6f7f4;--fg:#1d2a1f;--card:#fff;--ac:#2e7d32;--mut:#5b6b5e;--bd:#dfe5dc}
@media(prefers-color-scheme:dark){:root{--bg:#121712;--fg:#e8efe8;--card:#1b231c;--mut:#a3b3a5;--bd:#2c382d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif}
header{background:var(--ac);color:#fff;padding:18px 16px}header h1{margin:0;font-size:21px}header p{margin:4px 0 0;opacity:.9;font-size:14px}
main{max-width:720px;margin:0 auto;padding:12px 16px 40px}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:var(--card);color:var(--fg);margin:6px 0 12px}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:8px 0;padding:0 14px}
summary{padding:14px 0;font-weight:700;cursor:pointer}
summary small{font-weight:400;color:var(--mut);display:block}
ol{padding-left:20px}li{margin:8px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;margin:4px 6px 14px 0}
.tag{font-size:12px;background:var(--bd);border-radius:8px;padding:2px 8px;margin-left:6px;font-weight:400}
@media print{header{background:none;color:#000}button,input{display:none}details{border:0}details>*{display:block}}
</style></head><body>
<header><h1>Guía de la app de Ferjusanz</h1><p>Cómo hacer cada cosa, paso a paso</p></header>
<main><input id="q" type="search" placeholder="Buscar: pedido, albarán, sobrante, factura…">
<div id="l"></div></main>
<script>
const GUIA=[{"id": "empezar", "icono": "🚀", "titulo": "Primeros pasos", "roles": "t", "ir": null, "resumen": "Entrar en la app, instalarla en el móvil y moverse por ella.", "pasos": ["Abre el enlace de la app en Chrome (Android) e inicia sesión con tu correo y tu contraseña.", "Para tenerla como una app más: menú de Chrome (los tres puntos) → «Instalar aplicación» o «Añadir a pantalla de inicio».", "Abajo tienes la barra con las pantallas de siempre. Arriba, a la derecha: 🔍 Buscar, 💬 Chat del equipo y ❓ Ayuda.", "En «Inicio» están todos los apartados en cuadros. Si no ves uno, es que no es para tu puesto.", "Si pone «MODO PRÁCTICAS», los datos son de ejemplo y nada es real. Puedes probar sin miedo."]}, {"id": "preparar", "icono": "📋", "titulo": "Preparar un pedido", "roles": "p", "ir": "lista", "resumen": "Para quien saca el género y lo pesa.", "pasos": ["Entra en «Preparar» y elige el día arriba. Verás los pedidos de ese día.", "Toca el pedido que vas a preparar. Si otra persona ya lo lleva, la app te avisa.", "Toca cada línea (producto) y escribe lo que has preparado: kilos si se cobra por kilo, o unidades si se cobra por unidad. Pulsa guardar.", "Si falta algo o no hay, apúntalo en esa línea. No lo dejes sin marcar.", "Cuando todas las líneas estén hechas, pulsa «Terminar y crear albarán». Si pone «Faltan X líneas», aún queda alguna sin marcar.", "Los huevos se cobran por docenas: 1 caja de 15 docenas × 2,40 € = 36 €."]}, {"id": "carga", "icono": "🚚", "titulo": "Hoja de carga y sobrante", "roles": "p", "ir": "carga", "resumen": "Lo que hay que cargar en cada furgoneta y lo que sobra al volver.", "pasos": ["Entra en «Carga» y elige el día.", "«Por cliente»: marca cada línea cuando esté cargada. «Totales»: cuánto hay que cargar de cada producto (pedido menos sobrante del día anterior).", "«Sobrante»: al acabar el reparto pulsa «+ Añadir sobrante» y apunta lo que te queda. Al día siguiente se descuenta solo.", "Para imprimir: «Imprimir hoja de carga (A4)». Lleva huecos para apuntar el peso y lo que falte.", "Desde esta pantalla puedes ir a la hoja de compra y a «A quién hemos comprado»."]}, {"id": "entregar", "icono": "✅", "titulo": "Entregar y cobrar", "roles": "p", "ir": "entregas", "resumen": "Al llegar al cliente.", "pasos": ["Entra en «Entregas» y busca el pedido del cliente.", "Si el cliente paga al momento, se le da la copia BLANCA. La ROSA vuelve a la oficina.", "Si NO paga al momento, en vez de la blanca se le da la copia AMARILLA y el cliente la firma. La amarilla también vuelve a la oficina.", "Marca el pedido como entregado y, si cobras, apunta el cobro."]}, {"id": "venta_ruta", "icono": "➕", "titulo": "Venta en ruta (algo que no estaba en el pedido)", "roles": "t", "ir": "lista", "resumen": "El cliente te pide algo en el momento (por ejemplo, una caja de limones) y se lo dejas.", "pasos": ["Abre el pedido de ese cliente (en «Preparar» o en «Lista de pedidos»). Tiene que estar terminado.", "Pulsa «➕ Venta en ruta».", "Busca el producto, escribe la cantidad y la unidad. El precio sale de la tarifa del cliente; cámbialo si hace falta.", "Pulsa «Añadir al pedido y al albarán». La app avisa de que, si el albarán ya estaba en una factura de Golden, hay que corregirla allí.", "El albarán conserva su número y su importe se actualiza. La oficina asignará el lote en «Confirmar trazabilidad»."]}, {"id": "escribir", "icono": "✍️", "titulo": "Escribir un pedido (WhatsApp, texto, voz o foto)", "roles": "o", "ir": "importar", "resumen": "Para apuntar los pedidos que llegan por mensaje.", "pasos": ["Entra en «Escribir pedido» (o «Dictar pedido» si lo vas a decir en voz alta).", "Pega o escribe el pedido tal como te llega y pulsa «Interpretar pedido».", "Revisa el cliente: si no lo ha encontrado, búscalo escribiendo su nombre (vale aunque falte alguna letra) o créalo con «+ Crear cliente nuevo».", "Revisa la fecha de entrega y los productos. Lo que sale en ROJO hay que corregirlo: tócalo y la app te lleva directamente a ese punto.", "Cuando no quede nada en rojo, confirma. Nada se guarda solo."]}, {"id": "nuevo", "icono": "🆕", "titulo": "Crear un pedido a mano", "roles": "o", "ir": "nuevo", "resumen": "Cuando prefieres rellenarlo tú.", "pasos": ["Entra en «Nuevo pedido» y elige el cliente.", "Elige la fecha de entrega (puede ser dentro de varios días).", "Añade los productos y cantidades. Guarda.", "Después aparece en «Preparar», en el calendario y en «Lista de pedidos»."]}, {"id": "pedidos", "icono": "📑", "titulo": "Lista de pedidos y calendario", "roles": "t", "ir": "pedidos", "resumen": "Para consultar qué pedidos hay y de qué día.", "pasos": ["«Lista de pedidos»: elige «Desde» y «Hasta», filtra por estado y busca por cliente. Toca un pedido para abrirlo.", "«Calendario»: cada día muestra cuántos pedidos tiene. Toca un día para verlos.", "Desde el calendario puedes pasar a la lista con «Ver como lista», y al revés con «Ver en el calendario»."]}, {"id": "albaranes", "icono": "🧾", "titulo": "Albaranes", "roles": "t", "ir": "albaranes", "resumen": "Ver, buscar e imprimir albaranes.", "pasos": ["Entra en «Albaranes». Elige el periodo y, si quieres, busca por cliente o número.", "El botón de orden cambia entre más nuevos primero y más antiguos primero.", "Toca un albarán para abrirlo e imprimirlo. Salen tres copias: blanca (para el cliente), rosa (oficina) y amarilla (oficina; se entrega y se firma en lugar de la blanca si el cliente no paga al momento).", "Después de terminar un pedido, el albarán sale en esta lista."]}, {"id": "compra", "icono": "🧺", "titulo": "Hoja de compra", "roles": "t", "ir": "hojacompra", "resumen": "Qué hay que comprar en Mercamadrid para los pedidos de un día.", "pasos": ["Entra en «Hoja de compra». Elige la fecha con el calendario (los pedidos suelen llegar días antes).", "Verás cada producto con lo pedido, el sobrante restado y lo que hay que comprar.", "Pulsa «Imprimir hoja de compra (A4)». Lleva una casilla por producto y huecos para el proveedor y lo comprado."]}, {"id": "quien", "icono": "🛒", "titulo": "A quién hemos comprado hoy", "roles": "t", "ir": "quien", "resumen": "Para anotar a qué proveedor se compró cada producto. Sirve para la trazabilidad y para las facturas.", "pasos": ["Entra en «A quién compramos hoy».", "Para cada producto, escribe el nombre del proveedor del puesto donde lo has comprado. No hace falta saber lo que es un lote.", "Se puede dejar en blanco: no da error y se pueden hacer los albaranes igualmente. La oficina lo completará después."]}, {"id": "traza", "icono": "🔎", "titulo": "Confirmar trazabilidad", "roles": "o", "ir": "traza", "resumen": "Dejar apuntado de qué compra sale cada producto entregado.", "pasos": ["Entra en «Trazabilidad» → «Confirmar trazabilidad».", "La app propone a qué lote corresponde cada línea. En naranja están las que tienen varios lotes posibles: revísalas.", "Confirma pedido a pedido. Si falta información, puedes dejarlo «sin trazabilidad» indicando el motivo.", "Las ventas en ruta aparecen aquí pendientes de asignar lote."]}, {"id": "fclientes", "icono": "📄", "titulo": "Facturas de clientes", "roles": "o", "ir": "facturascli", "resumen": "Registro de las facturas que se emiten en Golden, para consultarlas por cliente.", "pasos": ["La factura se hace en Golden como siempre. Aquí solo se apunta.", "Entra en «Facturas de clientes» y pulsa «+ Añadir factura»: cliente, número, fecha e importe. Puedes adjuntar el PDF o una foto.", "Filtra por «Pendientes de cobro» o «Cobradas». Al tocar una factura puedes marcarla cobrada, ver el archivo o quitarla de la lista.", "En «Clientes», el botón «▾ Facturas» de cada cliente despliega sus facturas. También hay una pestaña «Facturas» dentro de la ficha."]}, {"id": "frecibidas", "icono": "📬", "titulo": "Facturas de proveedores por correo", "roles": "c", "ir": "compras", "resumen": "Las facturas que llegan al correo de facturas aparecen solas en la app.", "pasos": ["Las facturas con archivo adjunto que llegan al correo de facturas de Ferjusanz se suben solas cada pocos minutos.", "Entra en «Compras» → «Recibidas». Cada factura nueva se enlaza con la compra o el proveedor que corresponda.", "Si no es una factura, pulsa «Descartar»."]}, {"id": "registro", "icono": "📝", "titulo": "Registro de cambios", "roles": "o", "ir": "registro", "resumen": "Ver quién cambió qué y cuándo.", "pasos": ["Entra en «Registro de cambios».", "Aparece lo que se ha modificado en pedidos, albaranes, cobros, productos y clientes.", "Si se cambia algo de un pedido ya terminado, la app avisa con un número en el cuadro de Inicio.", "Dentro de un pedido, abajo, está el historial solo de ese pedido."]}, {"id": "chat", "icono": "💬", "titulo": "Chat, avisos y buscador", "roles": "t", "ir": "chat", "resumen": "Comunicarse con el equipo y encontrar cosas rápido.", "pasos": ["💬 (arriba) abre el chat del equipo. El número rojo son mensajes sin leer.", "«Avisos y ofertas» sirve para avisar a todos de algo importante.", "🔍 (arriba) busca clientes, productos, proveedores o números de albarán en toda la app.", "«Incidencias»: apunta cualquier problema (producto en mal estado, cliente que reclama…)."]}, {"id": "problemas", "icono": "🛟", "titulo": "Si algo no funciona", "roles": "t", "ir": null, "resumen": "Los problemas más habituales.", "pasos": ["Sin cobertura: la app guarda lo que haces y lo envía cuando vuelva la conexión. Algunas pantallas (facturas, registro) necesitan conexión.", "Si algo no se actualiza: tira de la pantalla hacia abajo o pulsa el botón ↻.", "Si no te deja entrar: comprueba el correo y la contraseña. Si no la recuerdas, díselo a la oficina.", "Si ves un mensaje en rojo que no entiendes, haz una captura (sin que salgan contraseñas) y mándala a la oficina.", "¿No encuentras cómo hacer algo? Pregúntale al asistente en ❓ Ayuda."]}];
const sin=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const tag={o:'Oficina',c:'Compras'};
function txt(g){return g.icono+' *'+g.titulo+'*\n'+g.resumen+'\n\n'+g.pasos.map((p,i)=>(i+1)+'. '+p).join('\n')}
function pinta(){const t=sin(document.getElementById('q').value);const l=document.getElementById('l');l.textContent='';
 GUIA.filter(g=>!t||sin(g.titulo+' '+g.resumen+' '+g.pasos.join(' ')).includes(t)).forEach(g=>{
  const d=document.createElement('details');if(t)d.open=true;
  const s=document.createElement('summary');s.textContent=g.icono+' '+g.titulo;if(tag[g.roles]){const b=document.createElement('span');b.className='tag';b.textContent=tag[g.roles];s.append(b)}
  const sm=document.createElement('small');sm.textContent=g.resumen;s.append(sm);d.append(s);
  const o=document.createElement('ol');g.pasos.forEach(p=>{const li=document.createElement('li');li.textContent=p;o.append(li)});d.append(o);
  const b=document.createElement('button');b.textContent='📲 Enviar por WhatsApp';b.onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(txt(g)+'\n\nGuía completa: '+location.href.replace(/[#?].*$/,'')),'_blank');d.append(b);l.append(d)});
 if(!l.children.length)l.textContent='No hay resultados.'}
document.getElementById('q').oninput=pinta;pinta();
</script></body></html>
