<script>
const GUIA=[{"id": "empezar", "icono": "🚀", "grupo": "Empezar", "titulo": "Primeros pasos", "roles": "t", "ir": null, "antes": "Todo en papel y de palabra: pedidos apuntados a mano o por WhatsApp, hojas sueltas, albaranes escritos a mano.", "ahora": "Un solo sitio, en el móvil, donde está todo: pedidos, hoja de carga, albaranes, compras y facturas. Lo que apuntas lo ven los demás al momento.", "pasos": ["Abre el enlace de la app en Chrome e inicia sesión con tu correo y contraseña.", "Para tenerla como una app más: menú de Chrome (tres puntos) → «Instalar aplicación» o «Añadir a pantalla de inicio».", "Abajo tienes la barra con las pantallas principales. Arriba a la derecha: 🔍 Buscar, ❓ Ayuda y 💬 Chat del equipo.", "«Inicio» muestra todos los apartados en cuadros. Si no ves uno, es que no es para tu puesto.", "Si arriba pone «MODO PRÁCTICAS», los datos son de ejemplo y nada es real. Puedes probar sin miedo.", "Sin cobertura no pasa nada: la app guarda lo que haces y lo envía cuando vuelve la conexión."], "resumen": "Un solo sitio, en el móvil, donde está todo: pedidos, hoja de carga, albaranes, compras y facturas. Lo que apuntas lo ven los demás al momento."}, {"id": "roles", "icono": "🔑", "grupo": "Empezar", "titulo": "Quién ve qué", "roles": "t", "ir": null, "antes": "Cada uno apuntaba lo suyo en su papel; los precios y cuentas los llevaba la oficina.", "ahora": "Cada persona ve solo lo que necesita para su trabajo, así no se mezclan cosas ni se enseñan datos que no tocan.", "pasos": ["Preparadores y repartidores: preparan pedidos, cargan, entregan, anotan sobrante y a quién se ha comprado. No ven precios de compra, caja ni rentabilidad.", "Compras: además ven las compras, los precios de compra, los lotes y las facturas de proveedores.", "Oficina: ven y gestionan todo lo del día a día: pedidos, albaranes, cobros, trazabilidad, facturas de clientes y el registro de cambios.", "Administrador: además hace la copia de seguridad y gestiona los usuarios.", "Todos ven «Deudas» (quién debe qué), para saber a quién reclamar al entregar."], "resumen": "Cada persona ve solo lo que necesita para su trabajo, así no se mezclan cosas ni se enseñan datos que no tocan."}, {"id": "dia", "icono": "📆", "grupo": "Día a día", "titulo": "Un día de trabajo, de principio a fin", "roles": "t", "ir": null, "antes": "Se escribían los pedidos el día anterior o antes; se hacía una hoja de compra para todos; se compraba; se preparaba mientras se apuntaban pesos y faltas en la hoja de carga; se cargaba; cada repartidor se llevaba los albaranes de sus clientes; se repartía y se apuntaba el sobrante.", "ahora": "Los mismos pasos, pero cada papel lo genera la app a partir de los pedidos. Se escribe una sola vez y todo lo demás sale solo.", "pasos": ["1. Pedidos: la oficina los apunta en «Escribir pedido» (pegando el WhatsApp) o «Nuevo pedido», con la fecha de entrega que toque, aunque sea de aquí a varios días.", "2. Compra: en «Hoja de compra» eliges el día y sale lo que hay que comprar, restando el sobrante. Se imprime y se lleva a Mercamadrid.", "3. Al comprar: se anota a qué proveedor se ha comprado cada producto en «A quién compramos hoy» (puede quedar en blanco).", "4. Preparar: los preparadores abren cada pedido en «Preparar» y escriben lo preparado. Si falta algo, lo marcan.", "5. Carga: la «Hoja de carga» dice qué cargar en cada furgoneta; se marca lo cargado. Se puede imprimir.", "6. Albaranes: al terminar cada pedido se crea su albarán. Se imprime y cada repartidor se lleva los de sus clientes.", "7. Reparto: se entrega, se cobra si toca, y se apunta si se deja algo más (venta en ruta).", "8. Al volver: se anota el sobrante. Al día siguiente se descuenta solo de lo que hay que cargar y comprar.", "9. Oficina: confirma la trazabilidad, apunta las facturas y controla los cobros."], "resumen": "Los mismos pasos, pero cada papel lo genera la app a partir de los pedidos. Se escribe una sola vez y todo lo demás sale solo."}, {"id": "escribir", "icono": "✍️", "grupo": "Día a día", "titulo": "Apuntar un pedido (WhatsApp, texto, voz o foto)", "roles": "o", "ir": "importar", "antes": "Los pedidos llegaban por WhatsApp, teléfono o en persona y alguien los pasaba a papel.", "ahora": "Pegas el mensaje tal cual y la app entiende cliente, fecha y productos. Tú solo revisas y confirmas.", "pasos": ["Entra en «Escribir pedido» (o «Dictar pedido» si lo vas a decir en voz alta; también se puede hacer una foto).", "Pega o escribe el pedido tal como te llega y pulsa «Interpretar pedido».", "Revisa el cliente. Si no lo ha encontrado, escribe su nombre en el buscador (vale aunque falte alguna letra) o créalo con «+ Crear cliente nuevo».", "Revisa la fecha de entrega y los productos. Lo que sale en ROJO hay que corregirlo: tócalo y la app te lleva directamente a ese punto.", "Cuando no quede nada en rojo, confirma. Nada se guarda solo.", "Los huevos se cobran por docenas (1 caja de 15 docenas × 2,40 € = 36 €)."], "resumen": "Pegas el mensaje tal cual y la app entiende cliente, fecha y productos. Tú solo revisas y confirmas."}, {"id": "nuevo", "icono": "🆕", "grupo": "Día a día", "titulo": "Crear un pedido a mano y pedidos habituales", "roles": "o", "ir": "nuevo", "antes": "Cada vez se volvía a escribir el pedido de los clientes que piden siempre lo mismo.", "ahora": "Los clientes fijos tienen su pedido «habitual» guardado: se crea con un botón.", "pasos": ["«Nuevo pedido»: elige cliente, fecha de entrega y añade productos y cantidades. Guarda.", "Para un cliente que repite: en su ficha, pestaña «Habituales», guarda su pedido de siempre y los días en que lo pide.", "En el «Calendario», al elegir un día, el botón «Crear pedidos habituales de este día» los crea todos de golpe.", "Los pedidos aparecen en «Preparar», en el calendario y en «Lista de pedidos»."], "resumen": "Los clientes fijos tienen su pedido «habitual» guardado: se crea con un botón."}, {"id": "pedidos", "icono": "📑", "grupo": "Día a día", "titulo": "Lista de pedidos y calendario", "roles": "t", "ir": "pedidos", "antes": "Había que buscar en las notas qué pedidos estaban apuntados y para qué día.", "ahora": "Ves todos los pedidos por fecha, estado y cliente, y los tocas para abrirlos.", "pasos": ["«Lista de pedidos»: elige «Desde» y «Hasta», filtra por estado y busca por cliente. Toca un pedido para abrirlo.", "«Calendario»: cada día muestra cuántos pedidos tiene; toca un día para verlos.", "Del calendario a la lista con «Ver como lista»; de la lista al calendario con «Ver en el calendario».", "La oficina puede anular un pedido equivocado (queda anotado, no se borra)."], "resumen": "Ves todos los pedidos por fecha, estado y cliente, y los tocas para abrirlos."}, {"id": "preparar", "icono": "📋", "grupo": "Día a día", "titulo": "Preparar un pedido", "roles": "t", "ir": "lista", "antes": "Se sacaba el género y se apuntaban pesos y faltas en la hoja; luego alguien lo pasaba a limpio para el albarán.", "ahora": "Escribes el peso o la cantidad de cada línea en el móvil. Al terminar, el albarán se crea solo, sin copiar nada.", "pasos": ["Entra en «Preparar» y elige el día arriba. Verás los pedidos de ese día.", "Toca el pedido que vas a preparar. Si otra persona ya lo lleva, la app te avisa.", "Toca cada línea y escribe lo preparado: kilos si se cobra por kilo, unidades si se cobra por unidad (caja, saco, docena…). Guarda.", "Si falta algo o no hay, márcalo en esa línea. No lo dejes sin marcar.", "Cuando todas las líneas están hechas, pulsa «Terminar y crear albarán». Si pone «Faltan X líneas», queda alguna sin marcar."], "resumen": "Escribes el peso o la cantidad de cada línea en el móvil. Al terminar, el albarán se crea solo, sin copiar nada."}, {"id": "carga", "icono": "🚚", "grupo": "Día a día", "titulo": "Hoja de carga", "roles": "t", "ir": "carga", "antes": "Una hoja en papel con lo que había que cargar; se iban apuntando a mano los pesos y lo que faltaba.", "ahora": "La hoja de carga se genera sola con los pedidos del día. Se marca lo que se va cargando y se puede imprimir igualmente.", "pasos": ["Entra en «Carga» y elige el día.", "«Por cliente»: cada cliente con sus líneas. Marca cada línea cuando esté cargada.", "«Totales»: cuánto hay que cargar de cada producto en total (lo pedido menos el sobrante del día anterior).", "«Sobrante»: lo que sobra al volver (ver el apartado de sobrante).", "«Imprimir hoja de carga (A4)»: sale con huecos para apuntar a mano el peso real y «falta: ______» si lo prefieres en papel.", "Desde aquí puedes ir a la hoja de compra y a «A quién hemos comprado»."], "resumen": "La hoja de carga se genera sola con los pedidos del día. Se marca lo que se va cargando y se puede imprimir igualmente."}, {"id": "sobrante", "icono": "♻️", "grupo": "Día a día", "titulo": "Anotar el sobrante", "roles": "t", "ir": "carga", "antes": "Al volver se apuntaba lo que sobraba y luego había que acordarse al día siguiente.", "ahora": "Lo que sobra se anota en la app y al día siguiente se resta solo de lo que hay que cargar y comprar.", "pasos": ["Entra en «Carga» → pestaña «Sobrante».", "Pulsa «+ Añadir sobrante», elige el producto, la cantidad y quién lo lleva.", "Al día siguiente, en «Totales» y en la hoja de compra, verás el sobrante ya restado."], "resumen": "Lo que sobra se anota en la app y al día siguiente se resta solo de lo que hay que cargar y comprar."}, {"id": "entregar", "icono": "✅", "grupo": "Día a día", "titulo": "Entregar y cobrar", "roles": "t", "ir": "entregas", "antes": "Cada repartidor se llevaba los albaranes de sus clientes y cobraba o dejaba la copia para firmar.", "ahora": "La app dice qué entregas tienes y a quién. Marcas entregado y apuntas el cobro desde el móvil.", "pasos": ["Entra en «Entregas» y busca el pedido del cliente.", "Si el cliente paga al momento, se le da la copia BLANCA. La ROSA vuelve a la oficina.", "Si NO paga al momento, en vez de la blanca se le da la copia AMARILLA y el cliente la firma. La amarilla también vuelve a la oficina.", "Marca el pedido como entregado y, si cobras, apunta el cobro.", "Antes de entregar puedes mirar «Deudas» por si ese cliente debe algo."], "resumen": "La app dice qué entregas tienes y a quién. Marcas entregado y apuntas el cobro desde el móvil."}, {"id": "venta_ruta", "icono": "➕", "grupo": "Día a día", "titulo": "Venta en ruta (algo que no estaba en el pedido)", "roles": "t", "ir": "lista", "antes": "Si el cliente pedía algo en el momento (por ejemplo, una caja de limones) se dejaba y luego había que acordarse de añadirlo al albarán.", "ahora": "Lo añades al pedido del cliente en el momento y el albarán se actualiza. No hace falta rehacer nada.", "pasos": ["Abre el pedido de ese cliente (en «Preparar» o «Lista de pedidos»). Tiene que estar terminado.", "Pulsa «➕ Venta en ruta».", "Busca el producto, escribe cantidad y unidad. El precio sale de la tarifa del cliente; cámbialo si hace falta.", "Pulsa «Añadir al pedido y al albarán». La app avisa de que, si el albarán ya estaba en una factura de Golden, hay que corregirla allí.", "El albarán conserva su número y su importe se actualiza. La oficina asignará el lote en «Confirmar trazabilidad»."], "resumen": "Lo añades al pedido del cliente en el momento y el albarán se actualiza. No hace falta rehacer nada."}, {"id": "ruta", "icono": "🗺️", "grupo": "Día a día", "titulo": "Ruta de reparto", "roles": "t", "ir": "ruta", "antes": "El orden de las paradas dependía de la memoria de cada repartidor.", "ahora": "La app propone el orden de las paradas según dónde está cada cliente y su horario.", "pasos": ["Entra en «Ruta», elige el día y la hora de salida (por defecto, Mercamadrid).", "Verás las paradas en orden, con la hora estimada de llegada.", "Para que funcione bien, cada cliente necesita su ubicación y su horario en la ficha (Clientes → Datos)."], "resumen": "La app propone el orden de las paradas según dónde está cada cliente y su horario."}, {"id": "albaranes", "icono": "🧾", "grupo": "Papeles e impresión", "titulo": "Albaranes y sus tres copias", "roles": "t", "ir": "albaranes", "antes": "Los albaranes se hacían a mano en papel, en tres copias de colores, y había que numerarlos y copiar los datos.", "ahora": "El albarán sale solo al terminar el pedido, con número, cliente, productos, pesos e importe. Se imprimen las tres copias de una vez.", "pasos": ["Entra en «Albaranes». Elige el periodo y busca por cliente o número. El botón de orden cambia entre más nuevos primero y más antiguos primero.", "Toca un albarán para abrirlo e imprimirlo.", "Salen tres copias: BLANCA (para el cliente si paga al momento), ROSA (oficina) y AMARILLA (oficina; si el cliente no paga al momento se le da esta en lugar de la blanca y la firma).", "Cada copia lleva escrito su nombre, así que se distinguen aunque la impresora no tenga color.", "Un albarán equivocado no se borra: la oficina lo anula con un motivo. Si solo falta algo, se usa «Venta en ruta».", "Elige el tamaño: papel A4 o ticket de 80 mm."], "resumen": "El albarán sale solo al terminar el pedido, con número, cliente, productos, pesos e importe. Se imprimen las tres copias de una vez."}, {"id": "bluetooth", "icono": "🖨️", "grupo": "Papeles e impresión", "titulo": "Imprimir con la impresora Bluetooth", "roles": "t", "ir": null, "antes": "Los albaranes se escribían a mano; las hojas de carga y compra, también.", "ahora": "Se imprimen desde el móvil, en la furgoneta o en el almacén, con una impresora Bluetooth pequeña. Albaranes, hoja de carga y hoja de compra salen con un botón.", "pasos": ["Una sola vez: empareja la impresora con el móvil en Ajustes → Bluetooth, y si la marca tiene aplicación o «servicio de impresión», instálalo (en Android suele ser lo que hace que aparezca en la lista de impresoras).", "En la app, abre el albarán (o la hoja de carga o de compra) y pulsa «Imprimir». Se abre la pantalla de impresión del móvil.", "Elige tu impresora Bluetooth en la lista y pulsa imprimir. Si no aparece, comprueba que está encendida y emparejada.", "Para impresoras de ticket (térmicas) elige «Ticket 80 mm» en el albarán. Para hojas grandes (hoja de carga y de compra) lo normal es A4 con una impresora de papel o guardar en PDF.", "Sin impresora a mano: en esa misma pantalla elige «Guardar como PDF» y envíalo por WhatsApp.", "Importante: esto depende de la impresora que compréis. Antes de comprar varias, probad una con un albarán real y decidid el tamaño que mejor se lee."], "resumen": "Se imprimen desde el móvil, en la furgoneta o en el almacén, con una impresora Bluetooth pequeña. Albaranes, hoja de carga y hoja de compra salen con un botón."}, {"id": "hojacarga_imp", "icono": "📄", "grupo": "Papeles e impresión", "titulo": "Hoja de carga y hoja de compra impresas", "roles": "t", "ir": "hojacompra", "antes": "Se hacía una hoja de compra para todos los pedidos del día, parecida a la de carga, y se apuntaba todo a mano.", "ahora": "Las dos hojas las genera la app. Se imprimen y, si hace falta, se anota a mano sobre el papel, como siempre.", "pasos": ["«Hoja de compra»: elige el día en el calendario (los pedidos suelen llegar días antes). Verás cada producto con lo pedido, el sobrante restado y lo que hay que comprar.", "Pulsa «Imprimir hoja de compra (A4)»: lleva una casilla por producto y huecos para el proveedor y lo comprado.", "«Hoja de carga» → «Imprimir hoja de carga (A4)»: lleva el peso y un hueco «falta» por línea.", "Las dos se pueden imprimir en papel, guardar en PDF o mandar por WhatsApp."], "resumen": "Las dos hojas las genera la app. Se imprimen y, si hace falta, se anota a mano sobre el papel, como siempre."}, {"id": "compra", "icono": "🧺", "grupo": "Compras y facturas", "titulo": "Qué comprar en Mercamadrid", "roles": "t", "ir": "hojacompra", "antes": "Alguien sumaba todos los pedidos a mano para saber cuánto comprar.", "ahora": "La app suma los pedidos del día y resta lo que sobró. Esa es tu lista de la compra.", "pasos": ["Entra en «Hoja de compra» y elige la fecha.", "Cada producto muestra: cuánto está pedido, cuánto sobra y cuánto hay que comprar.", "Imprímela o mírala en el móvil mientras compras.", "El personal de compras tiene también «Compras» → «Qué comprar», con más detalle."], "resumen": "La app suma los pedidos del día y resta lo que sobró. Esa es tu lista de la compra."}, {"id": "quien", "icono": "🛒", "grupo": "Compras y facturas", "titulo": "A quién hemos comprado hoy", "roles": "t", "ir": "quien", "antes": "El proveedor de cada cosa estaba en la cabeza de quien compraba o en la factura, que luego había que buscar.", "ahora": "Al comprar, cualquiera anota el nombre del puesto de Mercamadrid donde compró cada producto. Con eso se hace la trazabilidad y las facturas.", "pasos": ["Entra en «A quién compramos hoy».", "Para cada producto, escribe o elige el proveedor. No hace falta saber qué es un lote.", "Se puede dejar en blanco: no da error y los albaranes se pueden hacer igualmente. La oficina lo completará después.", "Esto es lo que luego permite saber de dónde salió cada producto si hay que responder a una inspección o a una reclamación."], "resumen": "Al comprar, cualquiera anota el nombre del puesto de Mercamadrid donde compró cada producto. Con eso se hace la trazabilidad y las facturas."}, {"id": "compras_reg", "icono": "🛍️", "grupo": "Compras y facturas", "titulo": "Registrar compras, lotes y precios de compra", "roles": "c", "ir": "compras", "antes": "Los albaranes y facturas de proveedores se guardaban en papel o en el correo, y para saber a cuánto salía un producto había que buscar.", "ahora": "Cada compra queda registrada con su proveedor, su lote y su precio. Se ve la evolución del precio de compra.", "pasos": ["Entra en «Compras» → «Registrar compra». Elige proveedor, fecha y productos con cantidades y precios.", "«Lotes»: cada producto comprado queda como lote. Es la base de la trazabilidad.", "«Sin factura»: compras todavía sin su factura. Se adjunta el archivo cuando llegue.", "«Precios de compra» (en Inicio) muestra cómo cambian por día const sin=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const tag={o:'Oficina',c:'Compras',a:'Admin'};
function txt(g){return g.icono+' *'+g.titulo+'*\n'+(g.antes?'📝 Antes: '+g.antes+'\n':'')+'📱 Ahora: '+g.ahora+'\n\n'+g.pasos.map((p,i)=>(i+1)+'. '+p).join('\n')}
function pinta(){const t=sin(document.getElementById('q').value);const l=document.getElementById('l');l.textContent='';
 let gr='';GUIA.filter(g=>!t||sin(g.titulo+' '+g.ahora+' '+(g.antes||'')+' '+g.pasos.join(' ')).includes(t)).forEach(g=>{
  if(!t&&g.grupo!==gr){gr=g.grupo;const hh=document.createElement('h2');hh.textContent=gr;hh.style.cssText='font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 0 4px';l.append(hh)}
  const d=document.createElement('details');if(t)d.open=true;
  const s=document.createElement('summary');s.textContent=g.icono+' '+g.titulo;if(tag[g.roles]){const b=document.createElement('span');b.className='tag';b.textContent=tag[g.roles];s.append(b)}
  const sm=document.createElement('small');sm.textContent=g.ahora;s.append(sm);d.append(s);
  if(g.antes){const a=document.createElement('div');a.className='antes';a.innerHTML='<b>📝 Antes</b><br>';a.append(document.createTextNode(g.antes));d.append(a)}
  const n=document.createElement('div');n.className='ahora';n.innerHTML='<b>📱 Ahora</b><br>';n.append(document.createTextNode(g.ahora));d.append(n);
  const o=document.createElement('ol');g.pasos.forEach(p=>{const li=document.createElement('li');li.textContent=p;o.append(li)});d.append(o);
  const b=document.createElement('button');b.textContent='📲 Enviar por WhatsApp';b.onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(txt(g)+'\n\nGuía completa: '+location.href.replace(/[#?].*$/,'')),'_blank');d.append(b);l.append(d)});
 if(!l.children.length)l.textContent='No hay resultados.'}
document.getElementById('q').oninput=pinta;pinta();
</script></body></html>
